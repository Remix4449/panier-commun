/* --------------------------- utilitaires --------------------------- */
const $ = s => document.querySelector(s);
const norm = s => (s||"").toString().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const esc = s => (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function slug(s){
  const out = norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60);
  return out || "x";
}
function itemId(name, unit){ return slug(name) + "--" + slug(unit||"u"); }
/* Un ingrédient ne s'écrit pas de la même façon d'une recette à l'autre :
   « Oignon » ici, « Oignons » là, « 200 gr » plutôt que « 200 g ». La clé
   d'un article gomme ces écarts — pluriel, ligatures, ponctuation, unité
   dite autrement — pour que deux recettes se retrouvent sur la même ligne de
   courses au lieu d'en ouvrir deux. Elle ne sert qu'à rapprocher : le nom
   affiché reste celui qu'on a écrit. */
function singulier(mot){
  if(mot.length > 4 && (/aux$/.test(mot) || /oux$/.test(mot))) return mot.slice(0, -1);
  if(mot.length > 3 && /s$/.test(mot) && !/ss$/.test(mot)) return mot.slice(0, -1);
  return mot;
}
const UNITE_ALIAS = {gr:"g", gramme:"g", kilo:"kg", kilogramme:"kg",
                     litre:"l", millilitre:"ml", centilitre:"cl", decilitre:"dl"};
function normUnit(unit){
  const u = singulier(norm(unit).replace(/[^a-z0-9]+/g, ""));
  return UNITE_ALIAS[u] || u;
}
function normName(name){
  const mots = norm(name).replace(/\u0153/g, "oe").replace(/\u00e6/g, "ae")
    .replace(/[^a-z0-9]+/g, " ").trim().split(" ").filter(Boolean);
  return mots.map(singulier).join(" ");
}
function itemKey(name, unit){ return normName(name) + "|" + normUnit(unit); }
function fmtQty(n){
  if(n==null || isNaN(n)) return "";
  const r = Math.round(n*100)/100;
  return String(r).replace(".",",");
}
/* Index nom → rayon de la base de produits, construit une fois. */
const PRODUIT_RAYON = new Map();
for(const [rayon, noms] of Object.entries(PRODUITS)){
  for(const n of noms) PRODUIT_RAYON.set(norm(n), rayon);
}
function guessRayon(name){
  const connu = PRODUIT_RAYON.get(norm(name));
  if(connu) return connu;
  /* Le mot le plus long gagne, avec une prime au mot de tête : « jus d'orange »
     part aux boissons, « lait de coco » reste en épicerie. */
  const n = " " + norm(name) + " ";
  let best = "divers", score = 0;
  for(const [rayon, words] of Object.entries(GUESS)){
    for(const w of words){
      const at = n.indexOf(w);
      if(at < 0) continue;
      const s = w.length + (at === 1 ? 4 : 0);
      if(s > score){ best = rayon; score = s; }
    }
  }
  return best;
}
function parseQuick(text){
  let rest = (text||"").trim().replace(/\s+/g," ");
  let qty = null, unit = "";
  const m = rest.match(/^(\d+(?:[.,]\d+)?|\d+\s*\/\s*\d+)\s*(.*)$/);
  if(m){
    const raw = m[1].replace(",",".");
    qty = raw.includes("/") ? (parseFloat(raw.split("/")[0]) / parseFloat(raw.split("/")[1])) : parseFloat(raw);
    rest = m[2];
    const u = rest.match(/^([^\s]+)\s+(.+)$/);
    if(u && UNITS.includes(norm(u[1]).replace(/\.$/,""))){ unit = u[1]; rest = u[2]; }
    else{
      const glued = m[2].match(/^(kg|g|mg|ml|cl|dl|l)\s*(.*)$/i);
      if(glued && glued[2]){ unit = glued[1].toLowerCase(); rest = glued[2]; }
    }
  }
  rest = rest.trim();
  if(rest) rest = rest.charAt(0).toUpperCase() + rest.slice(1);
  return {qty, unit, name:rest};
}

/* ------------------------------ import ------------------------------
   Une recette qui vient d'ailleurs : collée depuis une conversation,
   copiée sur un site, ou reçue par un lien « #r= » (la recette voyage
   dans le fragment, elle ne part donc jamais vers un serveur).
   Texte libre, JSON ou lien passent par le même entonnoir : on devine
   une fiche, on l'ouvre dans le formulaire, et rien n'est enregistré
   avant relecture.
--------------------------------------------------------------------- */
function b64urlTo(s){
  const b = String(s).replace(/-/g,"+").replace(/_/g,"/");
  const bin = atob(b + "=".repeat((4 - b.length % 4) % 4));
  const bytes = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
const firstOf = (o, keys) => { for(const k of keys){ if(o && o[k] != null && o[k] !== "") return o[k]; } return null; };
const stripPuce = s => String(s == null ? "" : s)
  .replace(/^\s*(?:[-–—*•·▪◦]+|\d+\s*[.)])\s+/, "").replace(/\*\*/g, "").replace(/^#+\s*/, "").trim();

function minutesOf(v){
  if(v == null || v === "") return null;
  if(typeof v === "number") return Math.round(v) || null;
  const s = String(v).toLowerCase();
  const iso = s.match(/^pt(?:(\d+)h)?(?:(\d+)m)?$/);
  if(iso) return (parseInt(iso[1] || 0, 10)*60 + parseInt(iso[2] || 0, 10)) || null;
  const h = s.match(/(\d+)\s*(?:h\b|heures?)\s*(\d+)?/);
  if(h) return parseInt(h[1],10)*60 + (h[2] ? parseInt(h[2],10) : 0);
  const m = s.match(/(\d+)/);
  return m ? parseInt(m[1],10) : null;
}
function intOf(v){
  if(v == null || v === "") return null;
  const m = String(v).match(/\d+/);
  return m ? parseInt(m[0],10) : null;
}
/* « 200 g de farine » : parseQuick laisse le « de » devant le nom. */
function ingName(s){
  const n = String(s == null ? "" : s).trim()
    .replace(/^(?:de\s+la\s+|de\s+l['’]\s*|du\s+|des\s+|de\s+|d['’]\s*)/i, "").trim();
  return n ? n.charAt(0).toUpperCase() + n.slice(1) : "";
}
function ingredientOf(raw){
  if(typeof raw === "string"){
    const p = parseQuick(stripPuce(raw));
    const name = ingName(p.name);
    if(!name) return null;
    return {name, qty:p.qty, unit:p.unit || "", rayon:guessRayon(name)};
  }
  if(!raw || typeof raw !== "object") return null;
  const name = ingName(firstOf(raw, ["name","nom","ingredient","ingrédient","label","item"]));
  if(!name) return null;
  let qty = firstOf(raw, ["qty","quantity","quantite","quantité","qte","amount"]);
  if(typeof qty === "string") qty = parseFloat(qty.replace(",","."));
  if(qty == null || isNaN(qty)) qty = null;
  const unit = String(firstOf(raw, ["unit","unite","unité","mesure"]) || "").trim();
  const key = raw.rayon ? String(raw.rayon).trim() : "";
  return {name, qty, unit, rayon:(key && rayonMap().has(key)) ? key : guessRayon(name)};
}

const CAT_MOTS = [
  [/dessert|g[âa]teau|tarte aux|crumble|mousse au|clafoutis|cookies?|biscuits?|glace|sorbet|compote|tiramisu|brownie|madeleine|cr[èe]me br[ûu]l/i, "Dessert"],
  [/ap[ée]ro|verrine|tapas|toasts?|cake sal[ée]|dips?/i, "Apéro"],
  [/soupe|velout[ée]|potage|gaspacho|entr[ée]e/i, "Entrée"],
  [/petit[- ]d[ée]j|pancakes?|granola|porridge|brioche|confiture/i, "Petit-déj"],
  [/pur[ée]e|gratin dauphinois|riz pilaf|accompagnement/i, "Accompagnement"]
];
function categoryOf(texte){
  for(const [re, cat] of CAT_MOTS) if(re.test(texte || "")) return cat;
  return "Plat";
}

function recipeOf(o){
  if(!o || typeof o !== "object") return null;
  const name = String(firstOf(o, ["name","nom","titre","title"]) || "").trim();
  let ings = firstOf(o, ["ingredients","ingrédients","ingredient"]) || [];
  if(!Array.isArray(ings)) ings = String(ings).split("\n");
  const ingredients = ings.map(ingredientOf).filter(Boolean);
  let steps = firstOf(o, ["steps","etapes","étapes","preparation","préparation","instructions","directions"]) || [];
  if(!Array.isArray(steps)) steps = String(steps).split("\n");
  steps = steps.map(stripPuce).filter(Boolean);
  if(!name && !ingredients.length) return null;
  const cat = String(firstOf(o, ["category","categorie","catégorie","type"]) || "").trim();
  const serv = intOf(firstOf(o, ["servings","personnes","parts","portions","pour","yield","couverts"]));
  return {
    name: name || "Recette",
    category: cat || categoryOf(name),
    servings: Math.max(1, Math.min(30, serv || 4)),
    minutes: minutesOf(firstOf(o, ["minutes","temps","duree","durée","time","totalTime","cookTime"])),
    ingredients, steps
  };
}

/* Un texte de recette a presque toujours la même charpente : un titre,
   deux lignes de métadonnées, « Ingrédients », « Préparation ». On suit
   ces titres quand ils sont là, et on devine ligne par ligne sinon. */
const H_ING  = /^[#*\s]*(?:les\s+)?ingr[ée]dients?\b/i;
const H_STEP = /^[#*\s]*(?:pr[ée]paration|[ée]tapes?|instructions?|r[ée]alisation|mode op[ée]ratoire|marche à suivre|recette)\b/i;
const H_SKIP = /^[#*\s]*(?:mat[ée]riel|ustensiles?|astuces?|conseils?|notes?|variantes?|conservation|accord|vins?|valeurs?|source|d[ée]gustation)\b/i;
const H_META = /^[#*\s]*(?:pour|temps|pr[ée]paration|cuisson|repos|difficult|budget|portions?|personnes?|niveau|co[ûu]t|calories)\b/i;
const estTitre = (line, re) => re.test(line) && line.length <= 60;

function estIngredient(line){
  const t = stripPuce(line);
  if(!t) return false;
  const mots = t.split(/\s+/).length;
  if(mots > 8) return false;
  if(parseQuick(t).qty != null) return true;
  return /^\s*[-–—*•·▪◦]/.test(line) && mots <= 5;
}

function recipeFromText(texte){
  const head = [], ingLines = [], stepLines = [];
  let mode = "head";
  for(const brut of String(texte || "").split(/\r?\n/)){
    const line = brut.trim();
    if(!line) continue;
    if(estTitre(line, H_ING)){ mode = "ing"; continue; }
    /* « Préparation : 20 min » est une métadonnée, pas un intertitre. */
    if(estTitre(line, H_STEP) && !/\d+\s*(?:h\b|heures?|min\b|minutes?)/i.test(line)){ mode = "step"; continue; }
    if(estTitre(line, H_SKIP)){ mode = "skip"; continue; }
    if(mode === "skip") continue;
    if(mode === "ing") ingLines.push(line);
    else if(mode === "step") stepLines.push(line);
    else head.push(line);
  }

  let name = "", titreAt = -1;
  for(let i = 0; i < head.length; i++){
    const t = stripPuce(head[i]).replace(/\s*:\s*$/, "");
    if(!t || H_META.test(t)) continue;
    name = t; titreAt = i; break;
  }

  /* Sans intertitres : les lignes courtes et chiffrées sont des
     ingrédients, les phrases sont des étapes. */
  if(!ingLines.length && !stepLines.length){
    for(const line of head.slice(titreAt + 1)){
      if(H_META.test(stripPuce(line))) continue;
      if(estIngredient(line)) ingLines.push(line);
      else if(stripPuce(line).split(/\s+/).length >= 4) stepLines.push(line);
    }
  }

  const entete = head.join("\n");
  const serv = entete.match(/(\d{1,2})\s*(?:personnes?|pers\b|parts?|portions?|convives?)/i) || entete.match(/pour\s+(\d{1,2})\b/i);
  let minutes = null;
  for(const d of (entete.match(/\d+\s*h(?:\s*\d+)?|\d+\s*(?:heures?|min\b|minutes?)/gi) || [])){
    const v = minutesOf(d);
    if(v && (minutes == null || v > minutes)) minutes = v;
  }

  return recipeOf({
    name, minutes, servings: serv ? serv[1] : null,
    category: categoryOf(name + "\n" + entete),
    ingredients: ingLines, steps: stepLines
  });
}

function asRecipes(data){
  const arr = Array.isArray(data) ? data
    : (data && Array.isArray(data.recipes)) ? data.recipes
    : (data && Array.isArray(data.recettes)) ? data.recettes : [data];
  return arr.map(recipeOf).filter(Boolean);
}
function parseRecipes(entree){
  const raw = String(entree || "").trim();
  if(!raw) return [];
  const lien = raw.match(/[#&]r=([A-Za-z0-9\-_%]+)/);
  if(lien){
    try{ return asRecipes(JSON.parse(b64urlTo(decodeURIComponent(lien[1])))); }
    catch(e){ return []; }
  }
  if(/^https?:\/\/\S+$/.test(raw)) return [];
  const bloc = raw.match(/```(?:json)?\s*([\s\S]+?)```/);
  const json = /^[{[]/.test(raw) ? raw : (bloc && /^[{[]/.test(bloc[1].trim()) ? bloc[1].trim() : null);
  if(json){
    try{ return asRecipes(JSON.parse(json)); }catch(e){ /* pas du JSON valide : on lira le texte */ }
  }
  const r = recipeFromText(raw);
  return r ? [r] : [];
}
/* --------------------- mémoire de l'interface ---------------------
   L'onglet ouvert, la position dans la page et les catégories repliées
   survivent au rechargement : on rouvre l'app là où on l'avait laissée.
   Rien de tout cela n'est partagé — c'est propre à ce téléphone.
------------------------------------------------------------------- */
const UI_TABS = ["recipes","list","week"];
/* Cadrage de l'écran Recettes : tout le carnet, les seules recettes cochées
   aux courses, ou les seules recettes posées sur un repas de la semaine. */
const SCOPES = ["", "list", "week"];
let ui = {tab:"recipes", scroll:0, closed:[], scope:"", parcours:false};

function loadUI(){
  try{
    const raw = JSON.parse(localStorage.getItem(LS_UI) || "null");
    if(raw && typeof raw === "object"){
      if(UI_TABS.indexOf(raw.tab) >= 0) ui.tab = raw.tab;
      if(typeof raw.scroll === "number" && raw.scroll >= 0) ui.scroll = raw.scroll;
      if(Array.isArray(raw.closed)) ui.closed = raw.closed.filter(x=>typeof x === "string");
      if(raw.parcours === true) ui.parcours = true;
      if(SCOPES.indexOf(raw.scope) >= 0) ui.scope = raw.scope;
      /* Installations d'avant les deux pastilles : le booléen « semaine »
         d'alors devient le cadrage du même nom. */
      else if(raw.week === true) ui.scope = "week";
    }
  }catch(e){}
}
let uiTimer;
function saveUI(now){
  clearTimeout(uiTimer);
  const write = ()=>{ try{ localStorage.setItem(LS_UI, JSON.stringify(ui)); }catch(e){} };
  if(now) write(); else uiTimer = setTimeout(write, 300);
}
function rememberScroll(){
  ui.scroll = Math.max(0, Math.round(window.scrollY || window.pageYOffset || 0));
  saveUI();
}
function restoreScroll(){
  const y = ui.scroll;
  if(!y) return;
  let stop = false, tries = 0;
  const cancel = ()=>{ stop = true; };
  window.addEventListener("touchstart", cancel, {passive:true, once:true});
  window.addEventListener("wheel", cancel, {passive:true, once:true});
  /* La hauteur de la page bouge encore — polices, données du foyer qui
     arrivent : on repose la page à sa place tant qu'elle n'y tient pas. */
  const go = ()=>{
    if(stop) return;
    window.scrollTo(0, y);
    if(++tries < 10 && Math.abs((window.scrollY||0) - y) > 2) setTimeout(go, 120);
  };
  requestAnimationFrame(go);
  setTimeout(go, 400);
  setTimeout(go, 900);
}

/* --------------------- clavier virtuel ---------------------
   Sur téléphone, le clavier recouvre le bas de l'écran sans faire remonter
   la page : le champ qu'on remplit se retrouve caché dessous. On mesure la
   zone réellement visible (visualViewport) et on y ramène le champ actif.
----------------------------------------------------------- */
const vvp = window.visualViewport || null;
function viewTop(){ return vvp ? vvp.offsetTop : 0; }
function viewHeight(){ return vvp ? vvp.height : window.innerHeight; }
function kbOpen(){ return vvp ? (window.innerHeight - vvp.height) > 120 : false; }
function isField(el){
  return !!el && /^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName || "") && el.type !== "hidden";
}
function keepVisible(el){
  if(!isField(el)) return;
  const box = el.closest(".item, .ingrow, .field, .addbar") || el;
  const r = box.getBoundingClientRect();
  const top = viewTop(), bottom = top + viewHeight();
  const sheet = el.closest(".sheet-body");
  if(sheet){
    const sr = sheet.getBoundingClientRect();
    const hi = Math.max(sr.top, top) + 12, lo = Math.min(sr.bottom, bottom) - 14;
    if(r.bottom > lo) sheet.scrollTop += r.bottom - lo;
    else if(r.top < hi) sheet.scrollTop += r.top - hi;
    return;
  }
  const head = document.querySelector(".topbar");
  const tabs = document.querySelector(".tabbar");
  const padTop = (head ? head.getBoundingClientRect().height : 0) + 10;
  const padBot = ((kbOpen() || !tabs) ? 0 : tabs.getBoundingClientRect().height) + 14;
  if(r.bottom > bottom - padBot) window.scrollBy({top:r.bottom - (bottom - padBot), behavior:"smooth"});
  else if(r.top < top + padTop) window.scrollBy({top:r.top - (top + padTop), behavior:"smooth"});
}
function followField(){
  const el = document.activeElement;
  if(isField(el)) keepVisible(el);
}

let toastTimer;
function toast(msg){
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2600);
}

/* ------------------------------ synchro ------------------------------
   Les trois collections vivent en local (localStorage) et, quand un foyer
   est configuré, dans une base Firebase Realtime Database via son API REST :
   flux d'événements en lecture (EventSource), PUT par document en écriture.
   Hors ligne, les écritures s'empilent dans une file et repartent au retour
   du réseau. Chaque document porte un updatedAt : le plus récent gagne.
--------------------------------------------------------------------- */
const COLS = ["recipes","shopping","plan","rayons","pantry"];
const LS_DATA = "panier.data.v1";
const LS_CFG  = "panier.foyer.v1";
const LS_UI   = "panier.ui.v1";
const state = { recipes:new Map(), shopping:new Map(), plan:new Map(), rayons:new Map(), pantry:new Map(),
                tab:"recipes", editing:null, ready:false, find:"", cat:"", scope:"" };

let localData = {recipes:{}, shopping:{}, plan:{}, rayons:{}, pantry:{}};
let queue = [];
let cfg = {url:"", code:""};
let es = null, esState = "off", firstSync = false, retryTimer = null;

/* Firebase efface toute clé mise à `null`, et le nœud resté vide avec elle.
   Un ingrédient sans quantité s'écrivait `sources[recette] = null` : la base
   avalait la clé, puis `sources` tout entier, et la ligne revenait aux deux
   téléphones sans plus rien pour dire de quelle recette elle venait. On
   écrit un tiret à la place, que la base garde, et la lecture le rend au
   `null` attendu partout ailleurs — les totaux ne voient jamais passer le
   tiret. */
const SANS_QTE = "—";
function packSources(sources){
  const out = {};
  for(const [rid, q] of Object.entries(sources||{})){
    out[rid] = (q == null || isNaN(q)) ? SANS_QTE : q;
  }
  return out;
}
function unpackSources(sources){
  const out = {};
  for(const rid of Object.keys(sources||{})){
    const q = sources[rid];
    out[rid] = typeof q === "number" ? q : null;
  }
  return out;
}
function clean(body){
  const out = {};
  for(const [k,v] of Object.entries(body)){ if(k!=="id" && v!==undefined) out[k]=v; }
  if(out.sources) out.sources = packSources(out.sources);
  return out;
}
function loadLocal(){
  try{
    const raw = JSON.parse(localStorage.getItem(LS_DATA) || "null");
    if(raw && raw.data){ localData = Object.assign({recipes:{},shopping:{},plan:{},rayons:{},pantry:{}}, raw.data); queue = raw.queue || []; }
  }catch(e){}
  try{ cfg = JSON.parse(localStorage.getItem(LS_CFG) || "null") || cfg; }catch(e){}
  const cutoff = Date.now() - 30*24*3600*1000;
  for(const col of COLS){
    for(const [id,d] of Object.entries(localData[col]||{})){
      if(d && d.deleted && (d.updatedAt||0) < cutoff) delete localData[col][id];
    }
  }
}
function persist(){
  try{ localStorage.setItem(LS_DATA, JSON.stringify({data:localData, queue})); }
  catch(e){ toast("Mémoire du téléphone pleine : videz des articles cochés."); }
}
function visible(col){
  const m = new Map();
  for(const [id,d] of Object.entries(localData[col]||{})){
    if(d && !d.deleted){
      const it = Object.assign({}, d, {id});
      if(it.sources) it.sources = unpackSources(it.sources);
      m.set(id, it);
    }
  }
  return m;
}
function emit(col){
  state[col] = visible(col);
  state.ready = true;
  render();
}
function save(col, id, body){
  localData[col][id] = Object.assign(clean(body), {updatedAt:Date.now()});
  persist(); emit(col); pushDoc(col, id);
  return Promise.resolve();
}
function drop(col, id){
  localData[col][id] = {deleted:true, updatedAt:Date.now()};
  persist(); emit(col); pushDoc(col, id);
  return Promise.resolve();
}

/* ---- écritures distantes ---- */
function roomUrl(suffix){
  return cfg.url.replace(/\/+$/,"") + "/f/" + cfg.code + (suffix||"") + ".json";
}
function pushDoc(col, id){
  if(!cfg.url || !cfg.code) return;
  if(!queue.some(q=>q.col===col && q.id===id)) queue.push({col, id});
  persist(); flush();
}
let flushing = false;
async function flush(){
  if(flushing || !cfg.url || !cfg.code || !queue.length) return;
  if(navigator.onLine === false){ updateSync(); return; }
  flushing = true;
  try{
    while(queue.length){
      const {col, id} = queue[0];
      const doc = localData[col][id];
      if(!doc){ queue.shift(); continue; }
      const res = await fetch(roomUrl("/" + col + "/" + id), {
        method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(doc)
      });
      if(!res.ok){
        if(res.status === 401 || res.status === 403) toast("Écriture refusée : vérifiez les règles de la base.");
        break;
      }
      queue.shift();
    }
  }catch(e){ /* hors ligne : on retentera */ }
  flushing = false;
  persist(); updateSync();
  if(queue.length && !retryTimer){
    retryTimer = setTimeout(()=>{ retryTimer = null; flush(); }, 15000);
  }
}
window.addEventListener("online", ()=>{ flush(); connect(); });
window.addEventListener("offline", updateSync);

/* ---- lecture temps réel ---- */
function mergeDoc(col, id, doc){
  const cur = localData[col][id];
  if(doc == null){
    if(cur){ delete localData[col][id]; return true; }
    return false;
  }
  if(typeof doc !== "object") return false;
  if(cur && (cur.updatedAt||0) > (doc.updatedAt||0)) return false;
  if(cur && JSON.stringify(cur) === JSON.stringify(doc)) return false;
  localData[col][id] = doc;
  return true;
}
function pushMissing(remote){
  for(const col of COLS){
    const far = (remote && remote[col]) || {};
    for(const [id, doc] of Object.entries(localData[col]||{})){
      const other = far[id];
      if(!other || (other.updatedAt||0) < (doc.updatedAt||0)) pushDoc(col, id);
    }
  }
}
function onStream(ev){
  let msg;
  try{ msg = JSON.parse(ev.data); }catch(e){ return; }
  if(!msg || msg.path === undefined) return;
  esState = "live";
  const parts = String(msg.path).split("/").filter(Boolean);
  const data = msg.data;
  const touched = new Set();
  let premier = false;
  if(parts.length === 0){
    const remote = data || {};
    for(const col of COLS){
      for(const [id, doc] of Object.entries(remote[col] || {})){
        if(mergeDoc(col, id, doc)) touched.add(col);
      }
    }
    if(!firstSync){ firstSync = true; premier = true; pushMissing(remote); }
  } else if(parts.length === 1){
    if(!COLS.includes(parts[0])) return;
    for(const [id, doc] of Object.entries(data || {})){
      if(mergeDoc(parts[0], id, doc)) touched.add(parts[0]);
    }
  } else {
    if(!COLS.includes(parts[0])) return;
    if(mergeDoc(parts[0], parts[1], data)) touched.add(parts[0]);
  }
  if(touched.size){ persist(); for(const col of touched) emit(col); }
  if(premier) alignerParcours();
  if(touched.has("shopping")) tidyShopping();
  updateSync();
}
function connect(){
  if(es){ try{ es.close(); }catch(e){} es = null; }
  if(!cfg.url || !cfg.code){ esState = "off"; updateSync(); return; }
  firstSync = false;
  esState = "wait"; updateSync();
  try{ es = new EventSource(roomUrl()); }
  catch(e){ esState = "wait"; updateSync(); return; }
  es.addEventListener("open", ()=>{ esState = "live"; updateSync(); });
  es.addEventListener("error", ()=>{ esState = "wait"; updateSync(); });
  es.addEventListener("put", onStream);
  es.addEventListener("patch", onStream);
  es.addEventListener("cancel", ()=>{
    esState = "wait"; updateSync();
    toast("Lecture refusée : vérifiez les règles de la base.");
  });
  flush();
}
function updateSync(){
  const el = document.getElementById("sync");
  const label = document.getElementById("syncLabel");
  if(!el) return;
  if(!cfg.url || !cfg.code){ el.dataset.state = "local"; label.textContent = "Ce téléphone"; return; }
  if(queue.length){ el.dataset.state = "wait"; label.textContent = queue.length + " en attente"; return; }
  if(esState === "live"){ el.dataset.state = "live"; label.textContent = "Foyer"; return; }
  el.dataset.state = "wait"; label.textContent = "Reconnexion";
}
function saveCfg(next){
  cfg = next;
  try{ localStorage.setItem(LS_CFG, JSON.stringify(cfg)); }catch(e){}
  connect();
}
function makeCode(){
  const a = "abcdefghijklmnopqrstuvwxyz0123456789";
  const buf = new Uint32Array(16);
  (window.crypto || window.msCrypto).getRandomValues(buf);
  return [...buf].map(n=>a[n % a.length]).join("");
}
function inviteLink(){
  const payload = btoa(JSON.stringify(cfg)).replace(/=+$/,"");
  return location.origin + location.pathname + "#f=" + encodeURIComponent(payload);
}

/* --------------------------- liste de courses --------------------------- */
/* `qtyOverride` : la quantité d'une ligne réécrite à la main dans
   l'éditeur. Elle remplace le total calculé à l'affichage, mais ne coupe
   pas le lien avec les recettes qui fournissent la ligne : décocher une
   recette retire bien ses ingrédients, même ceux dont la quantité a été
   retouchée. Le champ disparaît dès que les recettes d'une ligne
   changent, le total repart alors des ingrédients. */
function hasOverride(it){
  return !!it && Object.prototype.hasOwnProperty.call(it, "qtyOverride");
}
function itemTotal(it){
  if(hasOverride(it)){
    const v = it.qtyOverride;
    return (v==null || isNaN(v)) ? null : Number(v);
  }
  let total = 0, seen = false;
  if(it.manualQty){ total += Number(it.manualQty)||0; seen = true; }
  for(const v of Object.values(it.sources||{})){
    if(v!=null && !isNaN(v)){ total += Number(v); seen = true; }
  }
  return seen ? total : null;
}
/* `manual` : la ligne a été tapée dans la barre d'ajout. Le champ existe
   parce que `manualQty` ne suffisait pas — « Ail », ajouté sans quantité,
   vaut 0, et la ligne n'affichait alors rien du tout sous son nom. */
function isManual(it){
  return !!it && (it.manual === true || !!it.manualQty);
}
/* Les recettes citées par la ligne qui ne sont plus au carnet. Supprimer une
   recette retire maintenant ses ingrédients, mais les lignes écrites avant
   gardent la mention — et un téléphone qui n'a pas encore reçu la
   suppression faite sur l'autre passe un instant par là. */
function lostRecipes(it){
  return Object.keys(it.sources||{}).filter(rid => !state.recipes.get(rid)).length;
}
function itemFrom(it){
  const names = Object.keys(it.sources||{}).map(rid=>{
    const r = state.recipes.get(rid); return r ? r.name : null;
  }).filter(Boolean);
  if(lostRecipes(it)) names.push("Recette retirée");
  if(isManual(it)) names.unshift("Ajouté à la volée");
  if(hasOverride(it) && names.length) names.push("quantité ajustée");
  return names.join(" · ");
}
/* Le détail d'une ligne, pour l'éditeur : chaque recette qui la fournit et
   ce qu'elle y met. C'est ce qui rend lisible un total venu de plusieurs
   recettes — l'oignon de la bolognaise et celui du pilaf sur une ligne. */
function itemParts(it){
  const parts = [], perdues = [];
  for(const [rid, q] of Object.entries(it.sources||{})){
    const qty = (q==null || isNaN(q)) ? null : Number(q);
    const r = state.recipes.get(rid);
    if(r) parts.push({who:r.name || "Recette", qty});
    else perdues.push({who:"Recette retirée", qty});
  }
  parts.sort((a,b)=> a.who.localeCompare(b.who, "fr"));
  for(const p of perdues) parts.push(p);
  if(isManual(it)) parts.unshift({who:"Ajouté à la volée", qty:Number(it.manualQty) || null});
  return parts;
}
/* Un pense-bête : l'article est écrit, mais rien n'est compté sous son nom.
   Il peut donc rejoindre n'importe quelle ligne du même article sans en
   fausser le total. */
function isNote(it){
  return normUnit(it.unit) === "" && itemTotal(it) == null;
}
/* Retrouve la ligne où poser un ingrédient : la ligne exacte d'abord, puis
   une ligne équivalente — c'est elle qui évite le doublon « Oignon » /
   « Oignons ». À défaut, la ligne d'un simple pense-bête du même article :
   « Ail » tapé dans la barre, sans unité ni quantité, rejoint les trois
   gousses de la bolognaise au lieu d'ouvrir sa propre ligne. À plusieurs
   candidates, le plus petit identifiant l'emporte : les deux téléphones
   désignent alors la même ligne, chacun de son côté. */
function findItemId(name, unit, qty){
  const exact = itemId(name, unit);
  if(state.shopping.has(exact)) return exact;
  const cle = itemKey(name, unit);
  const nom = normName(name), u = normUnit(unit);
  /* Hors du pense-bête, deux unités pour un même nom — 200 g et 1 kg de
     farine — restent deux lignes : les additionner donnerait un total faux. */
  const note = u === "" && qty == null;
  let trouve = null, approche = null;
  for(const [iid, it] of state.shopping){
    if(itemKey(it.name, it.unit) === cle){
      if(trouve === null || iid < trouve) trouve = iid;
      continue;
    }
    if(normName(it.name) !== nom) continue;
    if(!note && !isNote(it)) continue;
    if(approche === null || iid < approche) approche = iid;
  }
  return trouve || approche || exact;
}
/* L'unité manquait à la ligne, l'ingrédient qui arrive en porte une : la
   ligne l'adopte, sans quoi « 3 gousses » s'afficherait sans son unité. */
function adoptUnit(body, unit){
  if(!body.unit && unit) body.unit = unit;
  return body;
}
/* Les lignes à fondre, par paquets. Deux écritures d'un même article se
   rejoignent quand leur clé complète est la même. Un pense-bête — ni unité
   ni quantité — rejoint en plus la ligne du même article qui compte dans une
   unité, puisqu'il n'ajoute aucun chiffre au total. Deux unités pour un même
   nom restent deux lignes, et le pense-bête n'a alors pas de camp. */
function duplicateGroups(){
  const parNom = new Map();
  for(const [iid, it] of state.shopping){
    const nom = normName(it.name);
    if(!parNom.has(nom)) parNom.set(nom, []);
    parNom.get(nom).push(iid);
  }
  const groupes = [];
  for(const ids of parNom.values()){
    const parUnite = new Map();
    for(const iid of ids){
      const u = normUnit(state.shopping.get(iid).unit);
      if(!parUnite.has(u)) parUnite.set(u, []);
      parUnite.get(u).push(iid);
    }
    const unites = [...parUnite.keys()].filter(u => u !== "");
    const sansUnite = parUnite.get("") || [];
    if(unites.length !== 1){
      for(const lot of parUnite.values()) groupes.push(lot);
      continue;
    }
    const notes = sansUnite.filter(iid => isNote(state.shopping.get(iid)));
    groupes.push(parUnite.get(unites[0]).concat(notes));
    groupes.push(sansUnite.filter(iid => notes.indexOf(iid) < 0));
  }
  return groupes.filter(g => g.length > 1);
}
/* Les doublons déjà dans la liste — écrits avant cette règle, ou arrivés de
   l'autre téléphone — se fondent en une seule ligne : les quantités
   s'additionnent et les recettes derrière chaque ligne se rejoignent. La
   ligne qui survit est la même des deux côtés, les deux téléphones
   convergent donc sans se contredire. */
let enFusion = false;
async function fuseDuplicates(){
  if(enFusion) return false;
  const groupes = duplicateGroups();
  let fait = false;
  enFusion = true;
  try{
    for(const ids of groupes){
      ids.sort();
      const garde = state.shopping.get(ids[0]);
      if(!garde) continue;
      const fondu = Object.assign({}, garde, {sources:Object.assign({}, garde.sources||{})});
      let manuel = Number(fondu.manualQty) || 0, done = !!fondu.done, main = isManual(fondu);
      /* La ligne qui survit porte l'unité du groupe : l'ail noté à la volée
         rejoint les gousses de la bolognaise, pas l'inverse. */
      if(!fondu.unit){
        const avecUnite = ids.map(i => state.shopping.get(i)).find(it => it && it.unit);
        if(avecUnite) fondu.unit = avecUnite.unit;
      }
      for(const autre of ids.slice(1)){
        const it = state.shopping.get(autre);
        if(!it) continue;
        for(const [rid, q] of Object.entries(it.sources||{})){
          const deja = fondu.sources[rid];
          if(deja == null) fondu.sources[rid] = q;
          else if(q != null) fondu.sources[rid] = Math.round((deja + q)*100)/100;
        }
        manuel += Number(it.manualQty) || 0;
        main = main || isManual(it);
        /* Une seule des deux lignes encore à prendre suffit à garder la
           ligne fondue à prendre. */
        done = done && !!it.done;
        if(it.createdAt && (!fondu.createdAt || it.createdAt < fondu.createdAt)) fondu.createdAt = it.createdAt;
        await drop("shopping", autre);
      }
      fondu.manualQty = manuel;
      fondu.done = done;
      if(main) fondu.manual = true;
      /* Les recettes derrière la ligne ont changé : un total réécrit à la
         main ne vaut plus, il repart des ingrédients. */
      delete fondu.qtyOverride;
      await save("shopping", ids[0], fondu);
      fait = true;
    }
  } finally { enFusion = false; }
  return fait;
}
/* Réparation des lignes que la base a coupées de leur recette — le `null`
   avalé, plus haut. Une recette qui se sait cochée alors que plus aucune
   ligne ne la cite est dans ce cas : on lui rend ses lignes. Elles seules :
   une ligne absente n'est pas recréée, elle a pu être retirée exprès.
   Passe unique de fait — une fois reliée, la recette ne repasse plus ici. */
async function relinkRecipes(){
  for(const r of [...state.recipes.values()]){
    if(!r.inList) continue;
    let liee = false;
    for(const it of state.shopping.values()){
      if(it.sources && (r.id in it.sources)){ liee = true; break; }
    }
    if(liee) continue;
    const facteur = (r.listServings || r.servings || 1) / (r.servings || 1);
    for(const ing of (r.ingredients||[])){
      const id = findItemId(ing.name, ing.unit, ing.qty);
      const it = state.shopping.get(id);
      if(!it) continue;
      const body = Object.assign({}, it, {sources:Object.assign({}, it.sources||{})});
      body.sources[r.id] = ing.qty == null ? null : Math.round(ing.qty*facteur*100)/100;
      /* Le 👋 d'une version précédente, posé sur une ligne devenue orpheline
         alors qu'elle venait d'une recette : la recette la réclame, et
         aucune quantité n'y a jamais été tapée à la main. */
      if(!body.manualQty) delete body.manual;
      await save("shopping", id, body);
    }
  }
}
/* Le ménage de la liste : rendre d'abord leurs recettes aux lignes qui les
   ont perdues, fondre les doublons ensuite. */
async function tidyShopping(){
  await relinkRecipes();
  await fuseDuplicates();
}
/* Tout ce qu'on ajoute à la volée est retenu : le nom tel qu'on l'écrit,
   son unité et son rayon — y compris corrigé après coup depuis la liste.
   L'article peut ensuite être coché, retiré, vidé avec les autres : la
   barre de recherche le reproposera quand même, sur les deux téléphones. */
const PANTRY_MAX = 240;
async function remember(name, unit, rayon){
  if(!name) return;
  const u = unit || "", ray = rayon || guessRayon(name);
  const id = itemId(name, u);
  const cur = state.pantry.get(id);
  if(cur && cur.name === name && (cur.unit||"") === u && (cur.rayon||"") === ray &&
     (Date.now() - (cur.usedAt||0)) < 3600*1000) return;
  await save("pantry", id, {name, unit:u, rayon:ray, usedAt:Date.now()});
  const all = [...state.pantry.values()];
  if(all.length > PANTRY_MAX){
    all.sort((a,b)=>(a.usedAt||0)-(b.usedAt||0));
    for(const old of all.slice(0, all.length - PANTRY_MAX)) await drop("pantry", old.id);
  }
}

async function addManual(name, qty, unit, rayon){
  if(!name) return;
  const id = findItemId(name, unit, qty);
  const cur = state.shopping.get(id);
  const body = cur ? Object.assign({}, cur) : {name, unit:unit||"", rayon:rayon||guessRayon(name), sources:{}, manualQty:0, done:false, createdAt:Date.now()};
  body.sources = Object.assign({}, body.sources||{});
  adoptUnit(body, unit);
  /* Sans quantité, on ajoute une unité de plus à ce qui est déjà prévu —
     « œufs » sur une ligne de 6 en fait 7. Mais pas quand la ligne compte
     dans une autre unité que celle tapée : « farine » sur 200 g ne vaut
     pas 201 g, la ligne est seulement remise à prendre. */
  const memeUnite = normUnit(unit) === normUnit(body.unit);
  const add = qty!=null ? qty
            : (itemTotal(body)==null ? null : (memeUnite ? 1 : null));
  if(add!=null){
    body.manualQty = (Number(body.manualQty)||0) + add;
    // quantité déjà réécrite à la main : on la complète, sinon l'ajout
    // resterait invisible derrière la valeur retouchée
    if(hasOverride(body)) body.qtyOverride = (Number(body.qtyOverride)||0) + add;
  }
  body.done = false;
  body.manual = true;
  body.name = body.name || name;
  await save("shopping", id, body);
  await remember(body.name, body.unit, body.rayon);
  toast(add!=null ? `${fmtQty(add)} ${unit||""} ${name} ajouté`.replace(/\s+/g," ") : `${name} ajouté`);
}
async function recipeToList(recipe, servings){
  const factor = (servings||recipe.servings||1) / (recipe.servings||1);
  /* Ce que cette recette a déjà posé sur chaque ligne : une recette qui
     nomme deux fois le même ingrédient — « Oignon » puis « Oignons » — ne
     tient que sur une ligne, où les deux quantités s'ajoutent. Et une
     recette posée plusieurs fois dans la semaine n'écrit toujours qu'une
     seule fois sous son nom : le total ne double pas. */
  const pose = new Map();
  for(const ing of (recipe.ingredients||[])){
    const id = findItemId(ing.name, ing.unit, ing.qty);
    const cur = state.shopping.get(id);
    const body = cur ? Object.assign({}, cur) : {name:ing.name, unit:ing.unit||"", rayon:ing.rayon||guessRayon(ing.name), sources:{}, manualQty:0, done:false, createdAt:Date.now()};
    body.sources = Object.assign({}, body.sources||{});
    adoptUnit(body, ing.unit);
    const part = ing.qty==null ? null : Math.round(ing.qty*factor*100)/100;
    const deja = pose.get(id);
    const total = (deja == null) ? part : (part == null ? deja : Math.round((deja + part)*100)/100);
    pose.set(id, total);
    body.sources[recipe.id] = total;
    delete body.qtyOverride;
    body.done = false;
    await save("shopping", id, body);
  }
  await save("recipes", recipe.id, Object.assign({}, recipe, {inList:true, listServings:servings||recipe.servings||null}));
}
async function recipeOffList(recipe){
  for(const [id, it] of state.shopping){
    if(!it.sources || !(recipe.id in it.sources)) continue;
    const sources = Object.assign({}, it.sources);
    delete sources[recipe.id];
    // plus aucune recette derrière la ligne, et rien d'ajouté à la volée :
    // elle quitte la liste, quantité retouchée ou non
    if(Object.keys(sources).length === 0 && !isManual(it)){ await drop("shopping", id); continue; }
    const reste = Object.assign({}, it, {sources});
    delete reste.qtyOverride;
    await save("shopping", id, reste);
  }
  await save("recipes", recipe.id, Object.assign({}, recipe, {inList:false, listServings:null}));
}
/* Une recette cochée le reste tant qu'on ne la décoche pas. La liste de
   courses vit sa propre vie une fois les courses faites — on y retire les
   articles pris, on en rajoute à la volée toute la semaine — et rien de
   tout cela ne doit toucher aux recettes de la semaine, qu'on garde sous
   les yeux pour cuisiner. Seuls « aux courses / dans la liste », « Tout
   décocher » et la suppression d'une recette décochent. */

/* ------------------------------ rendu ------------------------------ */
const ICON_CHECK = '<svg viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg>';
const ICON_IMAGE = '<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M4.5 16.5l4.5-4.5 3.5 3.5 2.5-2.5 4.5 4.5"/><circle cx="9" cy="9.5" r="1.3"/></svg>';

function render(){
  /* Le cadrage s'éteint de lui-même dès qu'il n'a plus rien à montrer —
     dernière recette décochée, semaine vidée : sans cela l'écran des
     recettes resterait vide sans qu'on sache pourquoi. */
  if((state.scope === "list" && !listCount()) || (state.scope === "week" && !weekCounts().size)){
    state.scope = ""; ui.scope = ""; saveUI();
  }
  renderHead();
  renderRecipes();
  renderList();
  renderWeek();
  const undone = [...state.shopping.values()].filter(i=>!i.done).length;
  const badge = $("#listBadge");
  badge.hidden = undone === 0;
  badge.textContent = undone > 99 ? "99" : undone;
}

function renderHead(){
  const titles = {recipes:"Recettes", list:"Liste de courses", week:"Repas de la semaine"};
  $("#viewTitle").textContent = titles[state.tab];
  const count = $("#viewCount");
  const acts = $("#headActions");
  if(state.tab === "recipes"){
    const n = state.recipes.size;
    const filtre = state.find || state.cat || state.scope;
    const vu = filtre ? recipesShown().length : n;
    const cochees = [...state.recipes.values()].filter(r=>r.inList).length;
    count.textContent = !n ? "" : (filtre ? vu + " sur " + n : n + (n>1 ? " recettes" : " recette"));
    acts.innerHTML = (cochees ? '<button class="btn btn-quiet" data-act="uncheck-all">Tout décocher</button>' : "") +
      (cochees ? '<button class="btn" data-act="export-image" aria-label="Exporter les recettes cochées en image" ' +
        'title="Exporter les recettes cochées en image">' + ICON_IMAGE + '</button>' : "") +
      '<button class="btn" data-act="import-recipe" aria-label="Importer une recette" title="Importer une recette collée">' +
        '<svg viewBox="0 0 24 24"><path d="M12 4v10"/><path d="M8.5 11l3.5 3.5L15.5 11"/><path d="M5 19h14"/></svg></button>' +
      '<button class="btn btn-primary" data-act="new-recipe"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Recette</button>';
  } else if(state.tab === "list"){
    const undone = [...state.shopping.values()].filter(i=>!i.done).length;
    const done = state.shopping.size - undone;
    count.textContent = state.shopping.size ? undone + " à prendre" : "";
    acts.innerHTML = done ? '<button class="btn btn-quiet" data-act="clear-done">Retirer les ' + done + ' cochés</button>' : "";
  } else {
    const planned = [...state.plan.values()].filter(p=>p.recipeId).length;
    count.textContent = planned ? planned + (planned>1 ? " repas" : " repas") : "";
    acts.innerHTML = planned
      ? '<button class="btn btn-primary" data-act="week-to-list">Tout aux courses</button><button class="btn btn-quiet" data-act="clear-week">Vider</button>'
      : "";
  }
}

function catOf(r){ return ((r && r.category) || "").trim() || SANS_CAT; }
function catKey(cat){ return "c-" + slug(cat); }
function catClosed(cat){ return ui.closed.indexOf(catKey(cat)) >= 0; }
function knownCats(){
  const out = new Set(CATEGORIES);
  for(const r of state.recipes.values()){
    const c = (r.category || "").trim();
    if(c) out.add(c);
  }
  return [...out].sort((a,b)=> a.localeCompare(b, "fr"));
}
/* Recettes retenues par la recherche : nom, catégorie ou ingrédient. */
function recipesFound(){
  const all = [...state.recipes.values()].sort((a,b)=>(a.name||"").localeCompare(b.name||"","fr"));
  const q = norm(state.find);
  if(!q) return all;
  return all.filter(r =>
    norm(r.name).includes(q) ||
    norm(r.category || "").includes(q) ||
    (r.ingredients || []).some(i => norm(i.name).includes(q)));
}
/* Les repas de la semaine, comptés par recette. Une recette posée deux
   fois y compte deux fois — ce chiffre s'affiche sur sa tuile — mais elle ne
   verse ses ingrédients aux courses qu'une seule fois. */
function listCount(){
  let n = 0;
  for(const r of state.recipes.values()) if(r.inList) n++;
  return n;
}
function weekCounts(){
  const m = new Map();
  for(const p of state.plan.values()){
    if(!p || !p.recipeId) continue;
    m.set(p.recipeId, (m.get(p.recipeId) || 0) + 1);
  }
  return m;
}
/* Ce que la recherche a retenu, puis le cadrage : les recettes cochées aux
   courses, ou celles posées sur un repas de la semaine. Les deux ne valent
   jamais ensemble — on regarde le carnet par un bout ou par l'autre. */
function recipesBase(){
  const found = recipesFound();
  if(state.scope === "list") return found.filter(r => r.inList);
  if(state.scope === "week"){
    const semaine = weekCounts();
    return found.filter(r => semaine.has(r.id));
  }
  return found;
}
function recipesShown(){
  const base = recipesBase();
  return state.cat ? base.filter(r => catOf(r) === state.cat) : base;
}

function tileHTML(r, groupé, repas){
  const meta = [];
  if(repas) meta.push('<span class="cat wk">' + repas + ' repas</span>');
  if(r.category && !groupé) meta.push('<span class="cat">' + catPic(catOf(r)) + ' ' + esc(r.category) + '</span>');
  if(r.servings) meta.push('<span class="num">' + esc(r.servings) + ' pers.</span>');
  if(r.minutes) meta.push('<span class="num">' + esc(r.minutes) + ' min</span>');
  meta.push('<span>' + ((r.ingredients||[]).length) + ' ingr.</span>');
  for(let i = meta.length - 1; i > 1; i--) meta.splice(i, 0, '<span class="dot"></span>');
  return '<li class="tile" data-inlist="' + (r.inList ? 1 : 0) + '">' +
    '<button class="tile-open" data-act="open-recipe" data-id="' + esc(r.id) + '">' +

    '<button class="tile-check" data-act="toggle-recipe" data-id="' + esc(r.id) + '" aria-pressed="' + (r.inList?"true":"false") + '" aria-label="Ajouter les ingrédients aux courses">' +
      '<span class="box">' + ICON_CHECK + '</span>' + (r.inList ? "dans<br>la liste" : "aux<br>courses") +
    '</button></li>';
}

function renderRecipes(){
  const ul = $("#recipeList");
  const box = $("#catFilters");
  const total = state.recipes.size;
  const semaine = weekCounts();
  const cochees = listCount();
  const found = recipesBase();

  /* pastilles de catégorie, comptées sur ce que le filtre laisse passer */
  const counts = new Map();
  for(const r of found) counts.set(catOf(r), (counts.get(catOf(r)) || 0) + 1);
  if(state.cat && !counts.has(state.cat)) state.cat = "";
  const cats = [...counts.keys()].sort((a,b)=> a.localeCompare(b, "fr"));
  const pastillesCats = (total < 2 || (cats.length < 2 && !state.cat)) ? "" :
    '<button class="chip" data-act="cat-filter" data-cat="" aria-pressed="' + (state.cat ? "false" : "true") + '">' +
      'Toutes<span class="n">' + found.length + '</span></button>' +
    cats.map(c => '<button class="chip" data-act="cat-filter" data-cat="' + esc(c) + '" aria-pressed="' + (state.cat === c ? "true" : "false") + '">' +
      catPic(c) + ' ' + esc(c) + '<span class="n">' + counts.get(c) + '</span></button>').join("");
  /* Les deux cadrages, dans l'ordre où l'on compose : on coche d'abord aux
     courses, on pose ensuite sur les jours. Chacun n'apparaît que lorsqu'il
     a quelque chose à montrer, et le compte de « Semaine » est celui des
     recettes distinctes, pas celui des repas — une recette servie deux fois
     n'y figure qu'une fois. */
  const cadrage = (nom, cle, pic, n, aide) => !n ? "" :
    '<button class="chip ' + cle + '" data-act="scope-filter" data-scope="' + cle + '" ' +
      'aria-pressed="' + (state.scope === cle ? "true" : "false") + '" aria-label="' + aide + '">' +
      pic + ' ' + nom + '<span class="n">' + n + '</span></button>';
  const pastillesCadrage =
    cadrage("Cochées", "list", ICON_CHECK, cochees, "Ne montrer que les recettes cochées aux courses") +
    cadrage("Semaine", "week", "📅", semaine.size, "Ne montrer que les recettes prévues cette semaine");
  box.innerHTML = pastillesCadrage +
    ((pastillesCadrage && pastillesCats) ? '<span class="chipsep" aria-hidden="true"></span>' : "") +
    pastillesCats;

  if(!total){
    ul.innerHTML = '<li>' + (state.ready
      ? '<div class="empty"><span class="pic" aria-hidden="true">📖</span><strong>Aucune recette pour l’instant</strong>Touchez « Recette » pour écrire la première, ou la flèche à côté pour coller une recette trouvée ailleurs : ses ingrédients partiront ensuite dans les courses en un geste.</div>'
      : '<div class="empty">Chargement…</div>') + '</li>';
    return;
  }
  const shown = recipesShown();
  if(!shown.length){
    const vides = {
      list: '<span class="pic" aria-hidden="true">🧺</span><strong>Rien de coché qui corresponde</strong>' +
            'Ce filtre ne garde que les recettes cochées aux courses. Touchez de nouveau « Cochées » pour revoir tout le carnet.',
      week: '<span class="pic" aria-hidden="true">📅</span><strong>Rien de prévu qui corresponde</strong>' +
            'Ce filtre ne garde que les recettes posées dans un repas de la semaine. Touchez de nouveau « Semaine » pour revoir tout le carnet.',
      "":   '<span class="pic" aria-hidden="true">🔍</span><strong>Rien ne correspond</strong>' +
            'Aucune recette ne répond à cette recherche. Essayez un autre mot, ou le nom d’un ingrédient.'
    };
    ul.innerHTML = '<li><div class="empty">' + vides[state.scope] + '</div></li>';
    return;
  }
  /* groupé par catégorie tant qu'aucune n'est sélectionnée */
  if(state.cat || cats.length < 2){
    ul.innerHTML = shown.map(r => tileHTML(r, false, semaine.get(r.id) || 0)).join("");
    return;
  }
  /* Chaque catégorie se replie d'une touche ; repliée, son en-tête dit
     encore ce qu'elle contient et ce qui part déjà aux courses. */
  let html = "";
  for(const c of cats){
    const list = shown.filter(r => catOf(r) === c);
    if(!list.length) continue;
    const fermee = catClosed(c);
    const dans = list.filter(r => r.inList).length;
    html += '<li class="grouphead" data-closed="' + (fermee ? 1 : 0) + '">' +
              '<button class="fold" data-act="fold-cat" data-cat="' + esc(c) + '" aria-expanded="' + (fermee ? "false" : "true") + '">' +
                '<svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>' +
                '<h3>' + catPic(c) + ' ' + esc(c) + '</h3><span class="rule"></span>' +
                '<span class="n">' + (dans ? dans + " ✓ · " : "") + list.length + '</span>' +
              '</button></li>' +
            (fermee ? "" : list.map(r => tileHTML(r, true, semaine.get(r.id) || 0)).join(""));
  }
  ul.innerHTML = html;
}

function renderList(){
  const wrap = $("#shopList");
  /* Un envoi de l'autre téléphone redessine la liste : on remet le curseur
     là où il était pour ne pas couper une saisie en cours. */
  const actif = document.activeElement;
  let keep = null;
  if(isField(actif) && wrap.contains(actif) && actif.dataset && actif.dataset.id){
    let start = null;
    try{ start = actif.selectionStart; }catch(e){}
    keep = {id:actif.dataset.id, name:actif.name, start};
  }
  const items = [...state.shopping.values()];
  const defs = rayonList();
  const byKey = new Map(defs.map(d => [d.key, d]));
  const foot = '<div class="listfoot"><button class="btn" data-act="rayons">' +
    '<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Gérer les rayons</button></div>';
  if(!items.length){
    wrap.innerHTML = (state.ready
      ? '<div class="empty"><span class="pic" aria-hidden="true">🧺</span><strong>Liste vide</strong>Tapez ce qu’il vous faut dans la barre ci-dessus — « 2 kg pommes de terre », « 6 œufs » — ou cochez une recette dans l’onglet Recettes.</div>'
      : '<div class="empty">Chargement…</div>') + foot;
    return;
  }
  const byRayon = new Map();
  for(const it of items){
    const r = byKey.has(it.rayon) ? it.rayon : "divers";
    if(!byRayon.has(r)) byRayon.set(r, []);
    byRayon.get(r).push(it);
  }
  let html = "";
  for(const def of defs){
    const list = byRayon.get(def.key);
    if(!list) continue;
    list.sort((a,b)=> (a.done?1:0)-(b.done?1:0) || (a.name||"").localeCompare(b.name||"","fr"));
    const left = list.filter(i=>!i.done).length;
    html += '<section class="aisle" data-swatch="' + esc(def.swatch) + '">' +
            '<div class="aisle-head"><span class="pic" aria-hidden="true">' + esc(def.pic || "") + '</span>' +
            '<h3>' + esc(def.name) + '</h3><span class="rule"></span>' +
            '<span class="n">' + left + "/" + list.length + '</span></div><ul class="items">';
    for(const it of list){
      const total = itemTotal(it);
      const main = isManual(it);
      const from = itemFrom(it);
      const parts = itemParts(it);
      const rk = byKey.has(it.rayon) ? it.rayon : "divers";
      html += '<li class="item' + (state.editing === it.id ? " editing" : "") + '" data-done="' + (it.done?1:0) + '" data-id="' + esc(it.id) + '">' +
        '<div class="item-row">' +
          '<button class="tick" data-act="tick" data-id="' + esc(it.id) + '" aria-pressed="' + (it.done?"true":"false") + '" aria-label="Cocher ' + esc(it.name) + '">' + ICON_CHECK + '</button>' +
          '<button class="item-body" data-act="edit-item" data-id="' + esc(it.id) + '">' +
            '<span class="item-name">' + esc(it.name) + '</span>' +
            (from ? '<span class="item-from">' + esc(from) + '</span>' : "") +
          '</button>' +
          (main ? '<span class="item-hand" title="Ajouté à la main" aria-label="Ajouté à la main" role="img">👋</span>' : "") +
          (total!=null ? '<span class="qty">' + esc(fmtQty(total) + (it.unit ? " " + it.unit : "")) + '</span>' : "") +
        '</div>' +
        '<div class="editor">' +
          (parts.length ? '<div class="from">' +
            '<span class="from-lab">Prévu avec</span><ul>' +
            parts.map(p => '<li><span class="who">' + esc(p.who) + '</span>' +
              (p.qty!=null ? '<span class="howmuch">' + esc(fmtQty(p.qty) + (it.unit ? " " + it.unit : "")) + '</span>' : "") +
            '</li>').join("") + '</ul>' +
            (hasOverride(it) ? '<p class="note">Quantité réécrite à la main : elle remplace ce total. Videz le champ pour la rendre au calcul.</p>' : "") +
          '</div>' : "") +
          '<input type="number" step="any" min="0" name="qty" value="' + (total!=null?esc(total):"") + '" data-id="' + esc(it.id) + '" aria-label="Quantité" placeholder="qté">' +
          '<input name="unit" value="' + esc(it.unit||"") + '" data-id="' + esc(it.id) + '" aria-label="Unité" placeholder="unité">' +
          '<select name="rayon" data-id="' + esc(it.id) + '" aria-label="Rayon">' +
            defs.map(d=>'<option value="' + esc(d.key) + '"' + (d.key===rk?" selected":"") + '>' + esc(d.name) + '</option>').join("") +
          '</select>' +
          '<button class="rm" data-act="remove-item" data-id="' + esc(it.id) + '">Supprimer</button>' +
        '</div></li>';
    }
    html += "</ul></section>";
  }
  wrap.innerHTML = html + foot;
  if(keep){
    const back = wrap.querySelector('.item[data-id="' + keep.id + '"] [name="' + keep.name + '"]');
    if(back){
      back.focus();
      try{ if(keep.start != null) back.setSelectionRange(keep.start, keep.start); }catch(e){}
    }
  }
}

function recipeByName(name){
  const n = norm(name || "");
  if(!n) return null;
  for(const r of state.recipes.values()) if(norm(r.name) === n) return r;
  return null;
}
/* `brouillon` : une recette importée, pas encore enregistrée. Si une
   recette du même nom existe déjà, le formulaire la met à jour plutôt
   que d'en créer une jumelle — réimporter deux fois ne duplique rien. */
function openRecipeForm(id, brouillon){
  const prev = id ? state.recipes.get(id) : (brouillon ? recipeByName(brouillon.name) : null);
  const r = brouillon || prev || null;
  sheetFormId = prev ? prev.id : null;
  const titre = brouillon ? (prev ? "Mettre à jour la recette" : "Recette reçue")
                          : (prev ? "Modifier la recette" : "Nouvelle recette");
  openSheet(
    '<div class="sheet-head"><h2>' + titre + '</h2>' + CLOSE_BTN + '</div>' +
    '<form class="sheet-body" id="recipeForm">' +
    (brouillon ? '<p class="note" style="margin:0 0 16px;text-align:left">' + (prev
      ? 'Une recette de ce nom est déjà là : enregistrer remplacera la sienne.'
      : 'Relisez les quantités — le rayon de chaque ingrédient est deviné, il se corrige depuis les courses.') + '</p>' : "") +
      '<div class="field"><label for="rName">Nom</label><input id="rName" name="name" required placeholder="Gratin de courgettes" value="' + (r ? esc(r.name) : "") + '"></div>' +
      '<div class="row2">' +
        '<div class="field"><label for="rCat">Catégorie</label>' +
          '<input id="rCat" name="category" list="catList" value="' + esc(r ? (r.category||"") : "Plat") + '" placeholder="Plat" autocomplete="off">' +
          '<datalist id="catList">' + knownCats().map(c=>'<option value="' + esc(c) + '"></option>').join("") + '</datalist></div>' +
        '<div class="field"><label for="rServ">Personnes</label><input id="rServ" name="servings" type="number" min="1" max="30" value="' + ((r && r.servings) || 4) + '"></div>' +
        '<div class="field"><label for="rMin">Minutes</label><input id="rMin" name="minutes" type="number" min="0" max="999" placeholder="45" value="' + ((r && r.minutes) || "") + '"></div>' +
      '</div>' +
      '<div class="field"><label>Ingrédients</label><div id="ingRows"></div>' +
        '<div class="hint">Quantité, unité, nom. Une ligne vide s\'ajoute dès que vous écrivez.</div></div>' +
      '<div class="field"><label for="rSteps">Préparation</label><textarea id="rSteps" name="steps" placeholder="Une étape par ligne.">' + (r ? esc((r.steps||[]).join("\n")) : "") + '</textarea></div>' +
    '</form>' +
    '<div class="sheet-foot">' +
      ((prev && !brouillon)
         ? '<button class="btn" data-act="open-recipe" data-id="' + esc(prev.id) + '">Annuler</button>'
         : '<button class="btn" data-act="close">Annuler</button>') +
      '<button class="btn btn-primary" data-act="save-recipe">Enregistrer</button></div>'
  );
  if(r){ (r.ingredients||[]).forEach(ing => addIngRow(ing)); addIngRow(); }
  else { addIngRow(); addIngRow(); addIngRow(); }
}
function addIngRow(ing){
  const wrap = document.getElementById("ingRows");
  if(!wrap) return;
  const div = document.createElement("div");
  div.className = "ingrow";
  div.innerHTML = '<input class="q" name="q" inputmode="decimal" placeholder="200" aria-label="Quantité" value="' + esc(ing && ing.qty != null ? fmtQty(ing.qty) : "") + '">' +
    '<input class="u" name="u" placeholder="g" aria-label="Unité" value="' + esc((ing && ing.unit) || "") + '">' +
    '<input class="n" name="n" placeholder="Farine" aria-label="Ingrédient" value="' + esc((ing && ing.name) || "") + '">' +
    '<button type="button" class="x" data-act="rm-ing" aria-label="Retirer la ligne">×</button>';
  wrap.appendChild(div);
}
async function saveRecipe(){
  const form = document.getElementById("recipeForm");
  if(!form) return;
  const prev = sheetFormId ? state.recipes.get(sheetFormId) : null;
  const fld = n => form.querySelector('[name="' + n + '"]');
  const name = fld("name").value.trim();
  if(!name){ fld("name").focus(); toast("Il manque le nom de la recette."); return; }
  // un rayon choisi à la main sur un ingrédient survit à la modification
  const rayonsConnus = new Map(((prev && prev.ingredients) || []).map(i => [norm(i.name), i.rayon]));
  const ingredients = [...document.querySelectorAll("#ingRows .ingrow")].map(row=>{
    const n = row.querySelector('[name="n"]').value.trim();
    if(!n) return null;
    const qRaw = row.querySelector('[name="q"]').value.trim().replace(",",".");
    const q = qRaw === "" ? null : parseFloat(qRaw);
    const u = row.querySelector('[name="u"]').value.trim();
    return {name:n, qty:(q!=null && !isNaN(q)) ? q : null, unit:u, rayon:rayonsConnus.get(norm(n)) || guessRayon(n)};
  }).filter(Boolean);
  const steps = fld("steps").value.split("\n").map(s=>s.trim().replace(/^\d+[.)]\s*/,"")).filter(Boolean);
  const id = prev ? prev.id : slug(name) + "-" + Math.random().toString(36).slice(2,6);
  const body = {
    name, category:fld("category").value.trim(), servings:parseInt(fld("servings").value,10)||4,
    minutes:parseInt(fld("minutes").value,10)||null, ingredients, steps,
    inList: prev ? !!prev.inList : false,
    listServings: prev ? (prev.listServings != null ? prev.listServings : null) : null,
    createdAt: (prev && prev.createdAt) || Date.now()
  };
  await save("recipes", id, body);
  // recette déjà aux courses : on refait ses lignes avec les nouveaux ingrédients
  if(prev && prev.inList){
    const fresh = Object.assign({id:id}, body);
    await recipeOffList(fresh);
    await recipeToList(fresh, body.listServings || body.servings);
  }
  sheetFormId = null;
  closeSheet();
  toast("« " + name + " » " + (prev ? "mise à jour" : "enregistrée"));
}

async function saveImported(d){
  const prev = recipeByName(d.name);
  const id = prev ? prev.id : slug(d.name) + "-" + Math.random().toString(36).slice(2,6);
  const body = {
    name:d.name, category:d.category || "", servings:d.servings || 4, minutes:d.minutes || null,
    ingredients:d.ingredients || [], steps:d.steps || [],
    inList: prev ? !!prev.inList : false,
    listServings: prev ? (prev.listServings != null ? prev.listServings : null) : null,
    createdAt: (prev && prev.createdAt) || Date.now()
  };
  await save("recipes", id, body);
  /* déjà aux courses : ses lignes repartent des nouveaux ingrédients */
  if(prev && prev.inList){
    const fresh = Object.assign({id:id}, body);
    await recipeOffList(fresh);
    await recipeToList(fresh, body.listServings || body.servings);
  }
}

/* ------------------------- export en image -------------------------
   Une affiche JPEG des recettes cochées : le papier chaud de l'écran,
   lisible telle quelle dans une galerie photo ou un fil de messages.
   Tout est dessiné sur un canvas, rien ne part vers un serveur.

   La page se compose en deux passes sur les mêmes fonctions : la
   première mesure sans rien peindre — c'est elle qui donne la hauteur du
   canvas —, la seconde peint. `peindre` est ce drapeau ; les deux passes
   avancent des mêmes hauteurs, sans quoi l'affiche serait décalée.
------------------------------------------------------------------- */
const EX_L = 1080;            /* largeur de l'affiche, en points de dessin */
const EX_MARGE = 66;
const EX_PIXELS_MAX = 13e6;   /* au-delà, l'encodage échoue sur certains téléphones */
/* Le papier de l'affiche ne suit pas le thème du téléphone : une image
   partagée reste claire, chez soi comme chez l'autre. */
const EX_PAPIER = {
  fond:"#FBF5EC", halo:"243,232,216", carte:"#FFFCF7", carte2:"#F6EEE2",
  encre:"#241C15", doux:"#7C6A58", trait:"#EBDFCE", traitFort:"#DCC9B0",
  accent:"#2F6E4F", accentEncre:"#1E4E37", accentDoux:"#DFEFE2", chaud:"#C4552E"
};
const EX_TITRE = '"Bricolage Grotesque","Karla",system-ui,sans-serif';
const EX_TEXTE = '"Karla",system-ui,-apple-system,sans-serif';
const EX_CHIFFRE = '"DM Mono","Karla",ui-monospace,monospace';

/* Les polices de l'écran ne sont pas forcément arrivées jusqu'au canvas :
   un canvas ne déclenche pas leur chargement, il faut le demander. Hors
   ligne, on dessine avec celles du téléphone — l'affiche tient debout. */
async function exPolices(){
  if(!document.fonts || !document.fonts.load) return;
  const faces = ['700 62px "Bricolage Grotesque"', '700 40px "Bricolage Grotesque"',
                 '400 22px "Karla"', '700 20px "Karla"', 'italic 21px "Karla"',
                 '500 21px "DM Mono"'];
  try{ await Promise.all(faces.map(f => document.fonts.load(f, "Recettes 123"))); }catch(e){}
  try{ await document.fonts.ready; }catch(e){}
}

/* Découpe un texte à la largeur donnée ; la police est déjà posée sur le
   contexte. Un mot plus long que la colonne est coupé plutôt que de
   déborder du papier. */
function exLignes(ctx, texte, largeur){
  const lignes = [];
  let ligne = "";
  for(const mot of String(texte == null ? "" : texte).split(/\s+/).filter(Boolean)){
    let m = mot;
    while(ctx.measureText(m).width > largeur){
      if(ligne){ lignes.push(ligne); ligne = ""; }
      let n = 1;
      while(n < m.length && ctx.measureText(m.slice(0, n + 1)).width <= largeur) n++;
      lignes.push(m.slice(0, n));
      m = m.slice(n);
      if(!m) break;
    }
    if(!m) continue;
    const essai = ligne ? ligne + " " + m : m;
    if(!ligne || ctx.measureText(essai).width <= largeur) ligne = essai;
    else { lignes.push(ligne); ligne = m; }
  }
  if(ligne) lignes.push(ligne);
  return lignes;
}
/* Un texte lettre à lettre, pour l'interlettrage des petites capitales :
   le canvas ne connaît letterSpacing que sur les téléphones récents. */
function exEspace(ctx, texte, x, y, espace, peindre){
  let cx = x;
  for(const c of String(texte)){
    if(peindre) ctx.fillText(c, cx, y);
    cx += ctx.measureText(c).width + espace;
  }
  return Math.max(0, cx - x - espace);
}
/* Un rectangle à coins arrondis : `roundRect` manque encore à l'appel
   sur les Safari d'avant 2023. */
function exCadre(ctx, x, y, w, h, r){
  const a = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + a, y);
  ctx.arcTo(x + w, y, x + w, y + h, a);
  ctx.arcTo(x + w, y + h, x, y + h, a);
  ctx.arcTo(x, y + h, x, y, a);
  ctx.arcTo(x, y, x + w, y, a);
  ctx.closePath();
}
function exLargeurPastille(ctx, texte){
  ctx.font = '700 20px ' + EX_TEXTE;
  return Math.round(ctx.measureText(texte).width) + 34;
}
function exPastille(ctx, texte, x, y, fond, encre, peindre){
  const w = exLargeurPastille(ctx, texte);
  if(peindre){
    ctx.fillStyle = fond;
    exCadre(ctx, x, y, w, 38, 19);
    ctx.fill();
    ctx.fillStyle = encre;
    ctx.textBaseline = "middle";
    ctx.fillText(texte, x + 17, y + 20);
    ctx.textBaseline = "alphabetic";
  }
  return w;
}
/* Un intertitre en petites capitales, prolongé d'un filet clair. */
function exSousTitre(ctx, texte, x, y, largeur, peindre){
  ctx.font = '700 19px ' + EX_TEXTE;
  if(peindre) ctx.fillStyle = EX_PAPIER.accent;
  const w = exEspace(ctx, texte.toUpperCase(), x, y, 3, peindre);
  if(peindre){
    ctx.fillStyle = EX_PAPIER.accentDoux;
    exCadre(ctx, x + w + 18, y - 8, Math.max(0, largeur - w - 18), 4, 2);
    ctx.fill();
  }
}
/* Une ligne d'ingrédient : la quantité calée à droite de sa gouttière,
   le nom en face. Une ligne sur deux est posée sur un fond tendre, comme
   dans la fiche de l'application. */
function exIngredient(ctx, ing, facteur, rang, x, y, largeur, peindre){
  const q = ing.qty != null ? fmtQty(ing.qty * facteur) + (ing.unit ? " " + ing.unit : "") : "—";
  const gouttiere = Math.min(170, Math.round(largeur * 0.38));
  ctx.font = '400 21px ' + EX_TEXTE;
  const lignes = exLignes(ctx, ing.name, largeur - gouttiere - 8);
  const h = Math.max(30, lignes.length * 30) + 14;
  if(peindre){
    if(rang % 2 === 0){
      ctx.fillStyle = EX_PAPIER.carte2;
      exCadre(ctx, x - 12, y, largeur + 24, h - 4, 11);
      ctx.fill();
    }
    ctx.font = '500 20px ' + EX_CHIFFRE;
    ctx.fillStyle = EX_PAPIER.accentEncre;
    ctx.textAlign = "right";
    ctx.fillText(q, x + gouttiere - 16, y + 27);
    ctx.textAlign = "left";
    ctx.font = '400 21px ' + EX_TEXTE;
    ctx.fillStyle = EX_PAPIER.encre;
    lignes.forEach((l, i) => ctx.fillText(l, x + gouttiere, y + 27 + i * 30));
  }
  return h;
}
/* Une étape, numérotée dans sa pastille. */
function exEtape(ctx, n, texte, x, y, largeur, peindre){
  const decalage = 54;
  ctx.font = '400 21.5px ' + EX_TEXTE;
  const lignes = exLignes(ctx, texte, largeur - decalage);
  if(peindre){
    ctx.fillStyle = EX_PAPIER.accentDoux;
    ctx.beginPath();
    ctx.arc(x + 17, y + 17, 17, 0, Math.PI * 2);
    ctx.fill();
    ctx.font = '500 18px ' + EX_CHIFFRE;
    ctx.fillStyle = EX_PAPIER.accentEncre;
    ctx.textAlign = "center";
    ctx.fillText(String(n), x + 17, y + 24);
    ctx.textAlign = "left";
    ctx.font = '400 21.5px ' + EX_TEXTE;
    ctx.fillStyle = EX_PAPIER.encre;
    lignes.forEach((l, i) => ctx.fillText(l, x + decalage, y + 24 + i * 31));
  }
  return Math.max(38, lignes.length * 31 + 4);
}
/* Les quantités de l'affiche sont celles qui sont parties aux courses :
   une recette cochée pour six s'imprime pour six. */
function exFacteur(r){ return (r.listServings || r.servings || 1) / (r.servings || 1); }

/* Le dedans d'une carte ; rend la hauteur occupée. */
function exContenu(ctx, r, rang, total, x, y, largeur, peindre){
  const debut = y;
  const facteur = exFacteur(r);
  const parts = r.listServings || r.servings || null;

  /* Seule sur l'affiche, la recette est déjà nommée en tête de page. */
  if(total > 1){
    ctx.font = '500 18px ' + EX_CHIFFRE;
    if(peindre) ctx.fillStyle = EX_PAPIER.chaud;
    exEspace(ctx, "RECETTE " + String(rang).padStart(2, "0"), x, y + 14, 3.2, peindre);
    y += 38;
    ctx.font = '700 40px ' + EX_TITRE;
    const titre = exLignes(ctx, r.name || "Sans nom", largeur);
    if(peindre){
      ctx.fillStyle = EX_PAPIER.encre;
      titre.forEach((l, i) => ctx.fillText(l, x, y + 34 + i * 46));
    }
    y += (titre.length - 1) * 46 + 50;
  }

  const pastilles = [];
  if(r.category) pastilles.push([catPic(catOf(r)) + " " + r.category, EX_PAPIER.accentDoux, EX_PAPIER.accentEncre]);
  if(parts) pastilles.push([parts + (parts > 1 ? " personnes" : " personne"), EX_PAPIER.carte2, EX_PAPIER.doux]);
  if(r.minutes) pastilles.push([r.minutes + " min", EX_PAPIER.carte2, EX_PAPIER.doux]);
  if(pastilles.length){
    let px = x;
    for(const p of pastilles){
      const w = exLargeurPastille(ctx, p[0]);
      if(px > x && px + w > x + largeur){ px = x; y += 48; }
      exPastille(ctx, p[0], px, y, p[1], p[2], peindre);
      px += w + 10;
    }
    y += 38;
  }

  const ings = (r.ingredients || []).filter(i => i && i.name);
  y += 42;
  exSousTitre(ctx, "Ingrédients", x, y, largeur, peindre);
  y += 24;
  if(!ings.length){
    ctx.font = 'italic 21px ' + EX_TEXTE;
    if(peindre){
      ctx.fillStyle = EX_PAPIER.doux;
      ctx.fillText("Aucun ingrédient noté.", x, y + 24);
    }
    y += 34;
  } else {
    /* Au-delà de sept ingrédients, deux colonnes : l'affiche reste courte
       et la liste se lit d'un coup d'œil. */
    const deux = ings.length > 7 && largeur > 560;
    const colL = deux ? (largeur - 52) / 2 : largeur;
    const coupe = deux ? Math.ceil(ings.length / 2) : ings.length;
    const colonnes = deux ? [ings.slice(0, coupe), ings.slice(coupe)] : [ings];
    let haut = 0;
    colonnes.forEach((liste, ci) => {
      let cy = y;
      const cx = x + ci * (colL + 52);
      liste.forEach((ing, i) => { cy += exIngredient(ctx, ing, facteur, i, cx, cy, colL, peindre); });
      haut = Math.max(haut, cy - y);
    });
    y += haut;
  }

  const etapes = (r.steps || []).filter(Boolean);
  if(etapes.length){
    y += 34;
    exSousTitre(ctx, "Préparation", x, y, largeur, peindre);
    y += 26;
    etapes.forEach((s, i) => { y += exEtape(ctx, i + 1, s, x, y, largeur, peindre) + 12; });
    y -= 12;
  }
  return y - debut;
}
/* Une carte de recette, fond et filet compris. Sa hauteur, mesurée à la
   passe de mesure, est retenue : une affiche de quinze recettes se compose
   deux fois moins longtemps. */
let exPlan = [];
function exCarte(ctx, r, rang, total, x, y, largeur, peindre){
  const pad = 46;
  if(exPlan[rang] == null){
    exPlan[rang] = exContenu(ctx, r, rang, total, x + pad, y + pad, largeur - pad * 2, false) + pad * 2;
  }
  const h = exPlan[rang];
  if(peindre){
    ctx.save();
    ctx.shadowColor = "rgba(70,48,24,.18)";
    ctx.shadowBlur = 34;
    ctx.shadowOffsetY = 14;
    ctx.fillStyle = EX_PAPIER.carte;
    exCadre(ctx, x, y, largeur, h, 30);
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = EX_PAPIER.trait;
    ctx.lineWidth = 1.5;
    exCadre(ctx, x, y, largeur, h, 30);
    ctx.stroke();
    exContenu(ctx, r, rang, total, x + pad, y + pad, largeur - pad * 2, true);
  }
  return h;
}
/* Le papier : fond chaud, halo en tête, grain léger et filet de cadre.
   Le grain n'est pas qu'une coquetterie — sans lui, les grands aplats
   d'un JPEG se voient par bandes. */
function exFond(ctx, hauteur){
  ctx.fillStyle = EX_PAPIER.fond;
  ctx.fillRect(0, 0, EX_L, hauteur);
  const halo = ctx.createLinearGradient(0, 0, 0, 560);
  halo.addColorStop(0, "rgba(" + EX_PAPIER.halo + ",1)");
  halo.addColorStop(1, "rgba(" + EX_PAPIER.halo + ",0)");
  ctx.fillStyle = halo;
  ctx.fillRect(0, 0, EX_L, 560);
  ctx.fillStyle = "rgba(124,106,88,.05)";
  const points = Math.min(9000, Math.round(EX_L * hauteur / 2600));
  for(let i = 0; i < points; i++) ctx.fillRect(Math.random() * EX_L, Math.random() * hauteur, 1.6, 1.6);
  ctx.strokeStyle = EX_PAPIER.traitFort;
  ctx.lineWidth = 2;
  exCadre(ctx, 26, 26, EX_L - 52, hauteur - 52, 34);
  ctx.stroke();
}
function exDate(){
  try{ return new Date().toLocaleDateString("fr-FR", {day:"numeric", month:"long", year:"numeric"}); }
  catch(e){ return ""; }
}
/* La page entière ; rend sa hauteur. */
function exPage(ctx, recettes, peindre, hauteur){
  const col = EX_L - EX_MARGE * 2;
  if(peindre) exFond(ctx, hauteur);
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  let y = 104;
  ctx.font = '700 21px ' + EX_TEXTE;
  if(peindre) ctx.fillStyle = EX_PAPIER.accent;
  exEspace(ctx, "PANIER COMMUN", EX_MARGE, y, 5, peindre);
  y += 54;
  const seule = recettes.length === 1 ? recettes[0] : null;
  ctx.font = '700 ' + (seule ? 56 : 62) + 'px ' + EX_TITRE;
  const titre = exLignes(ctx, seule ? (seule.name || "Recette") : "Nos recettes", col);
  const interligne = seule ? 64 : 70;
  if(peindre){
    ctx.fillStyle = EX_PAPIER.encre;
    titre.forEach((l, i) => ctx.fillText(l, EX_MARGE, y + i * interligne));
  }
  y += (titre.length - 1) * interligne + 34;
  ctx.font = '400 23px ' + EX_TEXTE;
  if(peindre){
    ctx.fillStyle = EX_PAPIER.doux;
    ctx.fillText((seule ? "" : recettes.length + " recettes · ") + exDate(), EX_MARGE, y);
  }
  y += 26;
  if(peindre){
    ctx.fillStyle = EX_PAPIER.chaud;
    exCadre(ctx, EX_MARGE, y, 96, 5, 3);
    ctx.fill();
  }
  y += 54;
  recettes.forEach((r, i) => { y += exCarte(ctx, r, i + 1, recettes.length, EX_MARGE, y, col, peindre) + 26; });
  y += 20;
  ctx.font = '400 19px ' + EX_TEXTE;
  if(peindre){
    ctx.fillStyle = EX_PAPIER.doux;
    ctx.textAlign = "center";
    ctx.fillText("Préparé avec Panier Commun", EX_L / 2, y);
    ctx.textAlign = "left";
  }
  return y + 62;
}
function exCanvas(recettes){
  exPlan = [];
  const mesure = document.createElement("canvas").getContext("2d");
  const hauteur = Math.round(exPage(mesure, recettes, false, 0));
  /* Un canvas trop grand n'est plus encodable : au-delà, on dessine la
     même affiche en plus petit plutôt que de rendre une image vide. */
  const echelle = Math.min(1, Math.sqrt(EX_PIXELS_MAX / (EX_L * hauteur)));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(EX_L * echelle);
  canvas.height = Math.round(hauteur * echelle);
  const ctx = canvas.getContext("2d");
  ctx.scale(echelle, echelle);
  exPage(ctx, recettes, true, hauteur);
  return canvas;
}

/* L'image fabriquée attend dans la feuille : le partage doit partir d'une
   touche, pas de la fin d'un calcul — iOS refuse le reste. */
let exUrl = "", exFichier = null, exNom = "";

function exOublier(){
  if(exUrl) URL.revokeObjectURL(exUrl);
  exUrl = ""; exFichier = null; exNom = "";
}
async function exporterRecettes(recettes){
  if(!recettes || !recettes.length){ toast("Aucune recette cochée"); return; }
  toast("Préparation de l’image…");
  await exPolices();
  let canvas = null, blob = null;
  try{
    canvas = exCanvas(recettes);
    blob = await new Promise(ok => canvas.toBlob(ok, "image/jpeg", 0.92));
  }catch(e){ blob = null; }
  if(!blob){ toast("L’image n’a pas pu être créée"); return; }
  exOublier();
  exUrl = URL.createObjectURL(blob);
  exNom = "panier-" + (recettes.length === 1 ? slug(recettes[0].name) : recettes.length + "-recettes") +
          "-" + new Date().toISOString().slice(0, 10) + ".jpg";
  try{
    const f = new File([blob], exNom, {type:"image/jpeg"});
    if(navigator.canShare && navigator.canShare({files:[f]})) exFichier = f;
  }catch(e){}
  openSheet(exFeuilleHTML(recettes, canvas, blob.size));
}

/* --------------------------- barre de recherche --------------------------- */
function catalog(){
  const out = new Map();
  for(const [rayon, words] of Object.entries(GUESS)){
    for(const w of words) out.set(w, {name:w.charAt(0).toUpperCase()+w.slice(1), rayon});
  }
  for(const [rayon, noms] of Object.entries(PRODUITS)){
    for(const n of noms) out.set(norm(n), {name:n, rayon});
  }
  for(const r of state.recipes.values()){
    for(const ing of (r.ingredients||[])) out.set(norm(ing.name), {name:ing.name, rayon:ing.rayon||guessRayon(ing.name), unit:ing.unit, known:true});
  }
  for(const p of state.pantry.values()) out.set(norm(p.name), {name:p.name, rayon:p.rayon||guessRayon(p.name), unit:p.unit, known:true});
  for(const it of state.shopping.values()) out.set(norm(it.name), {name:it.name, rayon:it.rayon, unit:it.unit, known:true});
  return [...out.values()];
}
function refreshAddBar(){
  const raw = $("#addInput").value;
  const p = parseQuick(raw);
  const parsed = $("#parsed");
  const sug = $("#suggest");
  if(!raw.trim()){ parsed.hidden = true; sug.hidden = true; return; }
  if(p.name){
    parsed.hidden = false;
    parsed.innerHTML = (p.qty!=null ? '<b>' + esc(fmtQty(p.qty) + (p.unit ? " " + p.unit : "")) + '</b>' : '<b>1</b>') +
      '<span>' + esc(p.name) + '</span><span class="ray">→ ' + esc(rayonName(guessRayon(p.name))) + '</span>';
  } else parsed.hidden = true;
  const q = norm(p.name);
  /* Ce qu'on a déjà ajouté soi-même passe devant les mots du dictionnaire,
     et un début de mot devant un morceau trouvé au milieu. */
  const hits = q.length < 2 ? [] : catalog()
    .map(c=>{
      const at = norm(c.name).indexOf(q);
      return at < 0 ? null : {c, score:(c.known ? 0 : 2) + (at === 0 ? 0 : 1)};
    })
    .filter(Boolean)
    .sort((a,b)=> a.score - b.score || a.c.name.localeCompare(b.c.name,"fr"))
    .slice(0,6).map(x=>x.c);
  if(!hits.length){ sug.hidden = true; return; }
  sug.hidden = false;
  sug.innerHTML = hits.map(c=>'<button type="button" data-act="suggest" data-name="' + esc(c.name) + '" data-rayon="' + esc(c.rayon||"divers") + '" data-unit="' + esc(c.unit||"") + '">' +
    esc(c.name) + '<span class="r">' + esc(rayonName(c.rayon)) + '</span></button>').join("");
}

document.addEventListener("click", async (ev)=>{

  if(act === "sync"){ openSyncSheet(); return; }
