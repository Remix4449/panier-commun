  if(act === "test-sync"){
    const out = document.getElementById("syncTest");
    const url = document.getElementById("dbUrl").value.trim().replace(/\/+$/,"");
    const code = document.getElementById("dbCode").value.trim();
    const say = (cls, title, detail) => {
      out.hidden = false; out.className = "testout" + (cls ? " " + cls : "");
      out.innerHTML = "<b>" + esc(title) + "</b>" + detail;
    };
    if(!url){ say("ko", "Adresse manquante", "Collez d\'abord l\'adresse de la base."); return; }
    if(!/firebasedatabase\.app|firebaseio\.com|localhost|127\./.test(url)){
      say("ko", "Ce n\'est pas une Realtime Database",
        "L\'adresse d\'une Realtime Database finit par <code>firebasedatabase.app</code> ou <code>firebaseio.com</code>. Une base <b>Firestore</b> ne convient pas : c\'est un autre produit, sans l\'API utilisée ici. Dans la console Firebase, menu <b>Realtime Database</b> — pas <b>Firestore Database</b>.");
      return;
    }
    say("", "Test en cours…", "");
    try{
      const stop = new AbortController();
      const timer = setTimeout(()=>stop.abort(), 8000);
      const res = await fetch(url + "/f/" + encodeURIComponent(code || "test") + ".json", {signal:stop.signal});
      const body = (await res.text()).slice(0, 300);
      clearTimeout(timer);
      if(res.ok){
        say("ok", "Connexion réussie",
          body === "null"
            ? "La base répond et le foyer est encore vide — c\'est normal avant le premier ajout. Enregistrez, la pastille doit passer à « Foyer »."
            : "La base répond et contient déjà des données.");
      } else if(res.status === 401 || res.status === 403){
        say("ko", "Lecture refusée par les règles",
          "La base existe mais refuse l\'accès. Retournez dans l\'onglet <b>Règles</b>, collez exactement celles indiquées plus haut, puis <b>Publier</b>. Vérifiez aussi que le code du foyer fait au moins 12 caractères. Réponse : <code>" + esc(body) + "</code>");
      } else if(res.status === 404){
        say("ko", "Adresse introuvable",
          "Aucune base à cette adresse. Recopiez celle affichée en haut de l\'écran Realtime Database, sans rien ajouter après. Réponse : <code>" + esc(body) + "</code>");
      } else {
        say("ko", "Erreur HTTP " + res.status, "<code>" + esc(body) + "</code>");
      }
    }catch(e){
      say("ko", e && e.name === "AbortError" ? "Pas de réponse en 8 secondes" : "Aucune réponse",
        "L\'adresse ne répond pas : faute de frappe, base supprimée, ou téléphone hors ligne.");
    }
    return;
  }
  if(act === "save-sync"){
    const url = document.getElementById("dbUrl").value.trim().replace(/\/+$/,"");
    const code = document.getElementById("dbCode").value.trim().replace(/[^a-zA-Z0-9_-]/g,"");
    if(url && !/^https:\/\/.+/.test(url) && !/^http:\/\/(localhost|127\.)/.test(url)){ toast("L'adresse doit commencer par https://"); return; }
    if(url && code.length < 12){ toast("Le code du foyer fait au moins 12 caractères."); return; }
    saveCfg({url, code});
    closeSheet();
    toast(url ? "Foyer enregistré, synchronisation en route" : "Synchronisation désactivée");
    return;
  }
  if(act === "copy-invite"){
    const field = document.getElementById("invite");
    const link = field ? field.value : inviteLink();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(link).then(()=>toast("Lien copié"), ()=>{ if(field){field.select();} toast("Copiez le lien sélectionné"); });
    } else if(field){ field.select(); document.execCommand("copy"); toast("Lien copié"); }
    return;
  }
  if(act === "leave-foyer"){
    saveCfg({url:"", code:""});
    closeSheet();
    toast("Ce téléphone n'est plus relié");
    return;
  }
  if(act === "fold-cat"){
    const key = catKey(btn.dataset.cat);
    const at = ui.closed.indexOf(key);
    if(at >= 0) ui.closed.splice(at, 1); else ui.closed.push(key);
    saveUI(true);
    renderRecipes();
    return;
  }
  if(act === "uncheck-all"){
    const cochees = [...state.recipes.values()].filter(r=>r.inList);
    if(!cochees.length){ toast("Aucune recette cochée"); return; }
    for(const r of cochees) await recipeOffList(r);
    toast(cochees.length > 1 ? cochees.length + " recettes décochées" : "Recette décochée");
    return;
  }
  if(act === "new-recipe"){ openRecipeForm(""); return; }
  if(act === "import-recipe"){ openImportSheet(); return; }
  if(act === "import-read"){
    const ta = document.getElementById("impText");
    const list = parseRecipes(ta ? ta.value : "");
    if(!list.length){ toast("Je n'ai pas reconnu de recette là-dedans."); return; }
    if(list.length === 1) openRecipeForm("", list[0]);
    else openImportPick(list);
    return;
  }
  if(act === "import-one"){
    const d = importDrafts[parseInt(btn.dataset.i, 10)];
    if(d) openRecipeForm("", d);
    return;
  }
  if(act === "import-all"){
    const list = importDrafts;
    importDrafts = [];
    for(const d of list) await saveImported(d);
    closeSheet();
    toast(list.length + (list.length > 1 ? " recettes ajoutées" : " recette ajoutée"));
    return;
  }
  if(act === "edit-recipe"){ openRecipeForm(id); return; }
  if(act === "save-recipe"){ await saveRecipe(); return; }
  if(act === "rm-ing"){
    const rows = document.querySelectorAll("#ingRows .ingrow");
    if(rows.length > 1) btn.closest(".ingrow").remove(); else btn.closest(".ingrow").querySelectorAll("input").forEach(i=>i.value="");
    return;
  }
  if(act === "open-recipe"){ openRecipe(id); return; }
  if(act === "export-image"){ await exporterRecettes(exChoisies()); return; }
  if(act === "export-one"){
    const r = state.recipes.get(id);
    if(r) await exporterRecettes([r]);
    return;
  }
  /* Le partage part de la touche, sans rien calculer entre les deux :
     iOS n'ouvre la feuille de partage que dans la foulée du geste. */
  if(act === "share-export"){
    if(!exFichier) return;
    try{ await navigator.share({files:[exFichier], title:"Nos recettes"}); }catch(e){}
    return;
  }
  if(act === "toggle-recipe"){
    const r = state.recipes.get(id); if(!r) return;
    if(r.inList){ await recipeOffList(r); toast("Ingrédients retirés des courses"); }
    else { await recipeToList(r, r.servings); toast("Ingrédients ajoutés aux courses"); }
    if($("#scrim").classList.contains("open")) closeSheet();
    return;
  }
  if(act === "add-servings"){
    const r = state.recipes.get(id); if(!r) return;
    await recipeToList(r, sheetServings);
    closeSheet(); toast("Ingrédients ajoutés pour " + sheetServings + " personnes");
    return;
  }
  if(act === "del-recipe"){
    const r = state.recipes.get(id); if(!r) return;
    /* Ses ingrédients quittent les courses d'abord, que la recette se
       sache cochée ou non : une ligne qui la cite encore resterait sinon
       sur la liste sans plus rien pour dire d'où elle vient. */
    await recipeOffList(r);
    await drop("recipes", id);
    for(const [slotId, p] of state.plan){ if(p.recipeId === id) await drop("plan", slotId); }
    closeSheet(); toast("Recette supprimée");
    return;
  }
  if(act === "serv-" || act === "serv+"){
    const open = state.recipes.get(sheetRecipeId);
    if(!open) return;
    sheetServings = Math.max(1, Math.min(30, sheetServings + (act === "serv+" ? 1 : -1)));
    $("#sheet").innerHTML = recipeSheetHTML(open);
    return;
  }

  if(act === "tick"){
    const it = state.shopping.get(id); if(!it) return;
    await save("shopping", id, Object.assign({}, it, {done:!it.done}));
    return;
  }
  if(act === "edit-item"){
    state.editing = state.editing === id ? null : id;
    renderList();
    const input = document.querySelector('.item.editing input[name="qty"]');
    if(input){ input.focus(); keepVisible(input); }
    return;
  }
  if(act === "remove-item"){
    state.editing = null;
    await drop("shopping", id);
    return;
  }
  if(act === "clear-done"){
    for(const [iid, it] of [...state.shopping]) if(it.done) await drop("shopping", iid);
    toast("Articles cochés retirés");
    return;
  }
  if(act === "suggest"){
    const p = parseQuick($("#addInput").value);
    await addManual(btn.dataset.name, p.qty, p.unit || btn.dataset.unit || "", btn.dataset.rayon);
    $("#addInput").value = ""; refreshAddBar(); $("#addInput").focus();
    return;
  }

  if(act === "pick"){ openPicker(btn.dataset.slot); return; }
  if(act === "set-slot"){
    const slot = btn.dataset.slot;
    if(!id) await drop("plan", slot);
    else{
      const r = state.recipes.get(id);
      await save("plan", slot, {recipeId:id, name:r ? r.name : "", updatedAt:Date.now()});
    }
    closeSheet();
    return;
  }
  if(act === "clear-week"){
    for(const [slotId] of [...state.plan]) await drop("plan", slotId);
    toast("Semaine vidée");
    return;
  }
  if(act === "week-to-list"){
    const ids = new Set([...state.plan.values()].map(p=>p.recipeId).filter(Boolean));
    let n = 0;
    for(const rid of ids){
      const r = state.recipes.get(rid);
      if(r && !r.inList){ await recipeToList(r, r.servings); n++; }
    }
    toast(n ? n + (n>1 ? " recettes ajoutées aux courses" : " recette ajoutée aux courses") : "Tout est déjà dans la liste");
    return;
  }

  if(act === "scope-filter"){
    /* Toucher le cadrage déjà allumé le rend au carnet entier ; toucher
       l'autre passe de l'un à l'autre, les deux ne valent jamais ensemble. */
    const veut = btn.dataset.scope || "";
    state.scope = (state.scope === veut) ? "" : veut;
    ui.scope = state.scope; saveUI();
    renderHead(); renderRecipes();
    return;
  }
  if(act === "cat-filter"){
    state.cat = btn.dataset.cat || "";
    renderHead(); renderRecipes();
    return;
  }
  if(act === "find-clear"){
    $("#findInput").value = ""; state.find = ""; $("#findClear").hidden = true;
    renderHead(); renderRecipes(); $("#findInput").focus();
    return;
  }

  if(act === "rayons"){ openRayons(); return; }

  /* Réinjecte les recettes du carnet absentes d'ici : une recette déjà
     présente garde la version du téléphone, retouches comprises. */
  if(act === "import-carnet"){
    const now = Date.now();
    let n = 0;
    for(const r of STARTERS){
      if(state.recipes.has(r.id)) continue;
      await save("recipes", r.id, Object.assign({}, r, {createdAt:now}));
      n++;
    }
    toast(n ? n + (n > 1 ? " recettes ajoutées" : " recette ajoutée") : "Le carnet était déjà complet");
    return;
  }
  if(act === "rayon-new"){ openRayonForm(null); return; }
  if(act === "rayon-edit"){ openRayonForm(id); return; }
  if(act === "swatch"){
    document.querySelectorAll("#rSwatches .swatch").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.id === id)));
    const f = document.getElementById("rSwatch");
    if(f) f.value = id;
    return;
  }
  if(act === "rayon-save"){
    const key = document.getElementById("rKey").value;
    const nom = document.getElementById("rNom");
    if(!nom.value.trim()){ nom.focus(); toast("Il manque le nom du rayon."); return; }
    await saveRayon(key || null, nom.value, document.getElementById("rPic").value.trim(), document.getElementById("rSwatch").value);
    const name = nom.value.trim();
    openRayons();
    toast(key ? "« " + name + " » modifié" : "« " + name + " » ajouté");
    return;
  }
  if(act === "rayon-del"){ await delRayon(id); openRayons(); toast("Rayon supprimé"); return; }
  if(act === "rayon-reset"){ await drop("rayons", id); openRayons(); toast("Rayon d’origine rétabli"); return; }
  if(act === "rayon-up"){ await moveRayon(id, -1); openRayons(); return; }
  if(act === "rayon-down"){ await moveRayon(id, 1); openRayons(); return; }
});


document.addEventListener("change", async (ev)=>{
  const el = ev.target;
  if(!el.closest || !el.closest(".editor")) return;
  const id = el.dataset.id;
  const it = state.shopping.get(id);
  if(!it) return;
  const body = Object.assign({}, it);
  if(el.name === "rayon") body.rayon = el.value;
  if(el.name === "unit") body.unit = el.value.trim();
  if(el.name === "qty"){
    const v = el.value.trim() === "" ? null : parseFloat(el.value.replace(",","."));
    const q = (v!=null && !isNaN(v)) ? v : null;
    if(Object.keys(body.sources||{}).length){
      // une recette fournit cette ligne : la quantité saisie s'affiche à la
      // place du total, mais la ligne reste rattachée à sa recette. Champ
      // vidé, le total repart du calcul — ce que dit l'éditeur, et ce que la
      // base ferait de toute façon d'un `null`.
      if(q == null) delete body.qtyOverride; else body.qtyOverride = q;
    }else{
      delete body.qtyOverride;
      body.manualQty = q==null ? 0 : q;
    }
  }
  if(el.name === "unit" || el.name === "qty"){
    const newId = itemId(body.name, body.unit);
    if(newId !== id){
      await drop("shopping", id); state.editing = newId;
      await save("shopping", newId, body);
      await remember(body.name, body.unit, body.rayon);
      return;
    }
  }
  await save("shopping", id, body);
  await remember(body.name, body.unit, body.rayon);
});

$("#addForm").addEventListener("submit", async (ev)=>{
  ev.preventDefault();
  const p = parseQuick($("#addInput").value);
  if(!p.name) return;
  await addManual(p.name, p.qty, p.unit, guessRayon(p.name));
  $("#addInput").value = ""; refreshAddBar();
});
$("#addInput").addEventListener("input", refreshAddBar);

$("#findForm").addEventListener("submit", ev=>{ ev.preventDefault(); $("#findInput").blur(); });
$("#findInput").addEventListener("input", ()=>{
  state.find = $("#findInput").value;
  $("#findClear").hidden = !state.find.trim();
  renderHead(); renderRecipes();
});

function showTab(name){
  state.tab = UI_TABS.indexOf(name) >= 0 ? name : "recipes";
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-current", String(t.dataset.tab === state.tab)));
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active", v.id === "view-" + state.tab));
  renderHead();
}
document.querySelectorAll(".tab").forEach(tab=>{
  tab.addEventListener("click", ()=>{
    showTab(tab.dataset.tab);
    window.scrollTo({top:0});
    ui.tab = state.tab; ui.scroll = 0; saveUI(true);
  });
});

/* ---- position dans la page, retenue pour le prochain démarrage ---- */
let scrollTick = false;
window.addEventListener("scroll", ()=>{
  if(scrollTick) return;
  scrollTick = true;
  requestAnimationFrame(()=>{ scrollTick = false; rememberScroll(); });
}, {passive:true});
window.addEventListener("pagehide", ()=>{ rememberScroll(); saveUI(true); });
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "hidden"){ rememberScroll(); saveUI(true); }
});

/* ---- clavier : le champ actif reste visible ---- */
document.addEventListener("focusin", ev=>{
  const el = ev.target;
  if(!isField(el)) return;
  keepVisible(el);
  setTimeout(()=>{ if(document.activeElement === el) keepVisible(el); }, 180);
  setTimeout(()=>{ if(document.activeElement === el) keepVisible(el); }, 450);
});
if(vvp){
  vvp.addEventListener("resize", ()=>{
    const pris = Math.max(0, Math.round(window.innerHeight - vvp.height));
    const ouvert = pris > 120;
    document.documentElement.style.setProperty("--kb", (ouvert ? pris : 0) + "px");
    document.documentElement.classList.toggle("kb", ouvert);
    followField();
    setTimeout(followField, 140);
    setTimeout(followField, 380);
  });
}

$("#scrim").addEventListener("click", ev=>{ if(ev.target === $("#scrim")) closeSheet(); });
document.addEventListener("keydown", ev=>{
  if(ev.key === "Escape" && $("#scrim").classList.contains("open")) closeSheet();
  if(ev.key === "Escape") $("#suggest").hidden = true;
});
document.addEventListener("input", ev=>{
  if(ev.target.closest && ev.target.closest("#ingRows")){
    const rows = document.querySelectorAll("#ingRows .ingrow");
    const last = rows[rows.length-1];
    if(last && [...last.querySelectorAll("input")].some(i=>i.value.trim())) addIngRow();
  }
});

/* ------------------------------ démarrage ------------------------------ */
(function boot(){
  loadLocal();
  loadUI();
  if("scrollRestoration" in history) history.scrollRestoration = "manual";
  const m = location.hash.match(/[#&]f=([^&]+)/);
  const rec = location.hash.match(/[#&]r=([A-Za-z0-9\-_%]+)/);
  if(m){
    try{
      const next = JSON.parse(atob(decodeURIComponent(m[1])));
      if(next && next.url && next.code){
        cfg = next;
        localStorage.setItem(LS_CFG, JSON.stringify(cfg));
        setTimeout(()=>toast("Foyer rejoint — les deux téléphones partagent la même liste."), 700);
      }
    }catch(e){}
  }
  if(m || rec) history.replaceState(null, "", location.pathname + location.search);
  const vide = COLS.every(c=>Object.keys(localData[c]||{}).length === 0);
  if(vide && !cfg.url){
    const now = Date.now();
    for(const r of STARTERS) localData.recipes[r.id] = Object.assign({}, r, {createdAt:now, updatedAt:now});
    persist();
  }
  for(const col of COLS) state[col] = visible(col);
  state.ready = true;
  state.scope = ui.scope;
  showTab(ui.tab);
  render();
  tidyShopping();
  if(!cfg.url || !cfg.code) alignerParcours();
  restoreScroll();
  updateSync();
  connect();
  if(rec) openImportFrom(rec[1]);
  window.addEventListener("hashchange", ()=>{
    const again = location.hash.match(/[#&]r=([A-Za-z0-9\-_%]+)/);
    if(!again) return;
    history.replaceState(null, "", location.pathname + location.search);
    openImportFrom(again[1]);
  });
  if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
})();

})();
</script>
