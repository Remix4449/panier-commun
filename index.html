<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panier Commun</title>
<meta name="description" content="Recettes, liste de courses triée par rayon et repas de la semaine, partagés entre deux téléphones.">
<meta name="theme-color" content="#FBF5EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16110D" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Panier">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Karla:ital,wght@0,400;0,500;0,700;1,400&family=DM+Mono:wght@400;500&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
</style>
</head>
<body>
<style>
/* =================================================================
   Panier Commun — habillage « marché »
   Fond papier chaud, cartes sans filet, un ton par rayon.
   Aucune règle ne dépend de la logique : seuls les noms de classes
   déjà produits par le rendu sont stylés.
================================================================= */
:root{
  --ground:#FBF5EC;
  --ground-tint:#F2E7D7;
  --surface:#FFFCF7;
  --surface-2:#F7EFE3;
  --ink:#241C15;
  --muted:#7C6A58;
  --line:#EBDFCE;
  --line-strong:#DCC9B0;
  --accent:#2F6E4F;
  --accent-ink:#1E4E37;
  --accent-soft:#DFEFE2;
  --warm:#C4552E;
  --warm-soft:#FAE2D5;
  --citron:#A0710F;
  --citron-soft:#F8EACB;
  --danger:#B03A22;
  --shadow:0 1px 1px rgba(70,48,24,.04), 0 10px 22px -16px rgba(70,48,24,.5);
  --shadow-lift:0 2px 3px rgba(70,48,24,.05), 0 22px 40px -26px rgba(70,48,24,.65);
  --radius:20px;
  --radius-sm:13px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#16110D;
    --ground-tint:#1F1811;
    --surface:#221A14;
    --surface-2:#2B211A;
    --ink:#F2E8DB;
    --muted:#A4917C;
    --line:#352A21;
    --line-strong:#493A2D;
    --accent:#7BC79B;
    --accent-ink:#A6DCBC;
    --accent-soft:#1D3A2B;
    --warm:#EE9370;
    --warm-soft:#3B241A;
    --citron:#E3BE72;
    --citron-soft:#332716;
    --danger:#E68A6C;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 26px -18px rgba(0,0,0,.95);
    --shadow-lift:0 2px 4px rgba(0,0,0,.5), 0 24px 44px -26px #000;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#16110D;
  --ground-tint:#1F1811;
  --surface:#221A14;
  --surface-2:#2B211A;
  --ink:#F2E8DB;
  --muted:#A4917C;
  --line:#352A21;
  --line-strong:#493A2D;
  --accent:#7BC79B;
  --accent-ink:#A6DCBC;
  --accent-soft:#1D3A2B;
  --warm:#EE9370;
  --warm-soft:#3B241A;
  --citron:#E3BE72;
  --citron-soft:#332716;
  --danger:#E68A6C;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 26px -18px rgba(0,0,0,.95);
  --shadow-lift:0 2px 4px rgba(0,0,0,.5), 0 24px 44px -26px #000;
  color-scheme:dark;
}

/* un ton par rayon : porté par la section, hérité par ses enfants */
.aisle{--ray:#7A6A5A;--ray-soft:#EFE6DA}
.aisle[data-rayon="fruits"]     {--ray:#3E8E4F;--ray-soft:#E2F2DE}
.aisle[data-rayon="boucherie"]  {--ray:#B8483F;--ray-soft:#FBE3DF}
.aisle[data-rayon="cremerie"]   {--ray:#A8801B;--ray-soft:#FAEFD1}
.aisle[data-rayon="boulangerie"]{--ray:#98682F;--ray-soft:#F6E7D2}
.aisle[data-rayon="epicerie"]   {--ray:#6D7A2B;--ray-soft:#EDF1D7}
.aisle[data-rayon="sucre"]      {--ray:#A24479;--ray-soft:#F8E2EF}
.aisle[data-rayon="surgeles"]   {--ray:#2F7391;--ray-soft:#DCEDF5}
.aisle[data-rayon="boissons"]   {--ray:#5B5BA6;--ray-soft:#E6E6F7}
.aisle[data-rayon="maison"]     {--ray:#457C79;--ray-soft:#DDEEEC}
.aisle[data-rayon="divers"]     {--ray:#7A6A5A;--ray-soft:#EFE6DA}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .aisle{--ray:#C2AE96;--ray-soft:#2E2419}
  :root:not([data-theme="light"]) .aisle[data-rayon="fruits"]     {--ray:#7EC98C;--ray-soft:#1B2E1E}
  :root:not([data-theme="light"]) .aisle[data-rayon="boucherie"]  {--ray:#EB8E84;--ray-soft:#33201D}
  :root:not([data-theme="light"]) .aisle[data-rayon="cremerie"]   {--ray:#E0BC5E;--ray-soft:#312716}
  :root:not([data-theme="light"]) .aisle[data-rayon="boulangerie"]{--ray:#D8A56C;--ray-soft:#2F2419}
  :root:not([data-theme="light"]) .aisle[data-rayon="epicerie"]   {--ray:#B5C46C;--ray-soft:#272B17}
  :root:not([data-theme="light"]) .aisle[data-rayon="sucre"]      {--ray:#DE8FBB;--ray-soft:#311F2A}
  :root:not([data-theme="light"]) .aisle[data-rayon="surgeles"]   {--ray:#79BBD6;--ray-soft:#17282F}
  :root:not([data-theme="light"]) .aisle[data-rayon="boissons"]   {--ray:#A0A0E0;--ray-soft:#20203A}
  :root:not([data-theme="light"]) .aisle[data-rayon="maison"]     {--ray:#7CC2BE;--ray-soft:#182B2A}
  :root:not([data-theme="light"]) .aisle[data-rayon="divers"]     {--ray:#C2AE96;--ray-soft:#2E2419}
}
:root[data-theme="dark"] .aisle{--ray:#C2AE96;--ray-soft:#2E2419}
:root[data-theme="dark"] .aisle[data-rayon="fruits"]     {--ray:#7EC98C;--ray-soft:#1B2E1E}
:root[data-theme="dark"] .aisle[data-rayon="boucherie"]  {--ray:#EB8E84;--ray-soft:#33201D}
:root[data-theme="dark"] .aisle[data-rayon="cremerie"]   {--ray:#E0BC5E;--ray-soft:#312716}
:root[data-theme="dark"] .aisle[data-rayon="boulangerie"]{--ray:#D8A56C;--ray-soft:#2F2419}
:root[data-theme="dark"] .aisle[data-rayon="epicerie"]   {--ray:#B5C46C;--ray-soft:#272B17}
:root[data-theme="dark"] .aisle[data-rayon="sucre"]      {--ray:#DE8FBB;--ray-soft:#311F2A}
:root[data-theme="dark"] .aisle[data-rayon="surgeles"]   {--ray:#79BBD6;--ray-soft:#17282F}
:root[data-theme="dark"] .aisle[data-rayon="boissons"]   {--ray:#A0A0E0;--ray-soft:#20203A}
:root[data-theme="dark"] .aisle[data-rayon="maison"]     {--ray:#7CC2BE;--ray-soft:#182B2A}
:root[data-theme="dark"] .aisle[data-rayon="divers"]     {--ray:#C2AE96;--ray-soft:#2E2419}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:"Karla","Helvetica Neue",Arial,sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.app{
  max-width:620px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
  background:var(--ground);position:relative;
}

/* ---------- bandeau ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  padding:16px 18px 12px;
  background:
    radial-gradient(120% 150% at 0% 0%, var(--accent-soft) 0%, transparent 58%),
    radial-gradient(100% 130% at 100% 0%, var(--warm-soft) 0%, transparent 52%),
    color-mix(in srgb, var(--ground) 86%, transparent);
  backdrop-filter:blur(12px) saturate(1.15);
}
.topbar::after{
  content:"";position:absolute;left:14px;right:14px;bottom:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--line-strong) 18%,var(--line-strong) 82%,transparent);
}
.brandrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{
  font-family:"Bricolage Grotesque","Karla",sans-serif;
  font-weight:700;font-size:27px;letter-spacing:-.035em;margin:0;line-height:1.05;
  font-variation-settings:"opsz" 32;
}
.brand span{color:var(--accent)}
.sync{
  margin-left:auto;display:inline-flex;align-items:center;gap:7px;
  font-size:12px;font-weight:500;color:var(--muted);
  border:1px solid var(--line-strong);border-radius:999px;padding:5px 12px;
  background:var(--surface);box-shadow:var(--shadow);transition:.15s;
}
.sync:hover{border-color:var(--accent);color:var(--accent)}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync[data-state="live"]{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:var(--accent-soft)}
.sync[data-state="live"] .dot{background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.sync[data-state="local"]{color:var(--citron);border-color:color-mix(in srgb,var(--citron) 38%,transparent);background:var(--citron-soft)}
.sync[data-state="local"] .dot{background:var(--citron)}

.viewhead{display:flex;align-items:center;gap:8px 10px;margin-top:12px;flex-wrap:wrap}
.viewhead h2{
  font-family:"Bricolage Grotesque","Karla",sans-serif;
  font-size:16px;font-weight:500;margin:0;letter-spacing:-.01em;color:var(--muted);white-space:nowrap;
}
.viewhead .count{
  font-size:12.5px;font-weight:500;color:var(--accent-ink);white-space:nowrap;
  background:var(--accent-soft);border-radius:999px;padding:3px 10px;
}
.viewhead .count:empty{display:none}
.headactions{margin-left:auto;display:flex;gap:8px}
.btn{
  border:1px solid var(--line-strong);border-radius:999px;padding:8px 15px;
  font-size:13.5px;font-weight:700;background:var(--surface);color:var(--ink);
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  box-shadow:var(--shadow);transition:transform .12s, box-shadow .12s, background .12s, color .12s;
}
.btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.btn:active{transform:none}
.btn-primary{background:var(--accent);border-color:transparent;color:#FFFCF7;box-shadow:0 2px 0 var(--accent-ink), var(--shadow)}
:root[data-theme="dark"] .btn-primary,
:root:not([data-theme="light"]) .btn-primary{color:#10231A;box-shadow:var(--shadow)}
.btn-primary:hover{background:var(--accent-ink);color:#FFFCF7;border-color:transparent}
:root[data-theme="dark"] .btn-primary:hover,
:root:not([data-theme="light"]) .btn-primary:hover{color:#10231A;filter:brightness(1.06)}
.btn-quiet{border-color:transparent;background:transparent;color:var(--muted);box-shadow:none;font-weight:500}
.btn-quiet:hover{color:var(--danger);background:var(--warm-soft);border-color:transparent;transform:none}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- vues ---------- */
.view{flex:1;padding:16px 18px 110px;display:none}
.view.active{display:block}

.empty{
  border-radius:var(--radius);
  padding:32px 24px;text-align:center;color:var(--muted);font-size:14.5px;line-height:1.6;
  background:
    radial-gradient(90% 120% at 50% 0%, var(--accent-soft) 0%, transparent 62%),
    var(--surface-2);
  box-shadow:inset 0 0 0 1px var(--line);
}
.empty .pic{display:block;font-size:34px;line-height:1;margin-bottom:10px}
.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:6px;font-family:"Bricolage Grotesque",sans-serif;letter-spacing:-.015em}

/* ---------- recettes ---------- */
.recipes{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.tile{
  display:flex;align-items:stretch;
  background:var(--surface);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;transition:transform .14s, box-shadow .14s;
  position:relative;
}
:root[data-theme="dark"] .tile,
:root:not([data-theme="light"]) .tile{box-shadow:inset 0 0 0 1px var(--line), var(--shadow)}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
:root[data-theme="dark"] .tile:hover,
:root:not([data-theme="light"]) .tile:hover{box-shadow:inset 0 0 0 1px var(--line-strong), var(--shadow-lift)}
.tile[data-inlist="1"]{background:linear-gradient(100deg,var(--accent-soft) 0 6px,var(--surface) 6px)}
.tile-open{flex:1;text-align:left;padding:15px 6px 15px 18px;display:block;min-width:0}
.tile-name{
  font-family:"Bricolage Grotesque","Karla",sans-serif;font-weight:700;font-size:18.5px;
  letter-spacing:-.02em;margin:0 0 5px;text-wrap:balance;line-height:1.2;
}
.tile-meta{font-size:13px;color:var(--muted);display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.tile-meta .cat{
  font-size:12px;font-weight:700;letter-spacing:0;text-transform:none;
  color:var(--citron);background:var(--citron-soft);border-radius:999px;padding:2px 10px;
}
.tile-meta .num{font-family:"DM Mono",ui-monospace,monospace;font-size:12.5px}
.tile-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--line-strong)}
.tile-check{
  width:74px;flex:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  color:var(--muted);font-size:11px;line-height:1.2;text-align:center;padding:8px 6px;
  border-left:1px dashed var(--line-strong);transition:.15s;
}
.tile-check .box{
  width:34px;height:34px;border-radius:12px;border:2px solid var(--line-strong);
  display:grid;place-items:center;background:var(--surface);transition:.15s;
}
.tile-check:hover .box{border-color:var(--accent);background:var(--accent-soft)}
.tile-check .box svg{width:19px;height:19px;stroke:var(--surface);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .15s}
.tile[data-inlist="1"] .tile-check{background:var(--accent-soft);color:var(--accent-ink);border-left-style:solid;border-left-color:transparent;font-weight:700}
.tile[data-inlist="1"] .tile-check .box{background:var(--accent);border-color:var(--accent)}
.tile[data-inlist="1"] .tile-check .box svg{opacity:1;stroke:#FFFCF7}
:root[data-theme="dark"] .tile[data-inlist="1"] .tile-check .box svg,
:root:not([data-theme="light"]) .tile[data-inlist="1"] .tile-check .box svg{stroke:#10231A}

/* ---------- recherche / ajout rapide ---------- */
.addbar{position:relative;margin-bottom:18px}
.addbar form{
  display:flex;gap:8px;align-items:center;
  background:var(--surface);border-radius:999px;padding:5px 5px 5px 16px;
  box-shadow:var(--shadow-lift);transition:box-shadow .15s;
}
:root[data-theme="dark"] .addbar form,
:root:not([data-theme="light"]) .addbar form{box-shadow:inset 0 0 0 1px var(--line-strong)}
.addbar form:focus-within{box-shadow:0 0 0 2px var(--accent), var(--shadow-lift)}
.addbar svg.mag{width:18px;height:18px;flex:none;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.addbar input{flex:1;min-width:0;border:none;background:none;padding:10px 0;outline:none;font-size:16px}
.addbar input::placeholder{color:var(--muted)}
.addbar .go{
  background:var(--accent);color:#FFFCF7;border-radius:999px;width:42px;height:42px;flex:none;
  display:grid;place-items:center;box-shadow:0 2px 0 var(--accent-ink);transition:.12s;
}
.addbar .go:hover{background:var(--accent-ink)}
:root[data-theme="dark"] .addbar .go,
:root:not([data-theme="light"]) .addbar .go{color:#10231A;box-shadow:none}
.addbar .go svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.parsed{
  font-size:13px;color:var(--muted);padding:9px 8px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
}
.parsed b{
  font-family:"DM Mono",ui-monospace,monospace;color:var(--ink);font-weight:500;
  background:var(--surface-2);border-radius:7px;padding:1px 7px;
}
.parsed .ray{color:var(--accent);font-weight:700}
.suggest{
  position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:20;
  background:var(--surface);border-radius:var(--radius-sm);
  box-shadow:var(--shadow-lift), inset 0 0 0 1px var(--line);overflow:hidden;max-height:46vh;overflow-y:auto;
}
.suggest button{
  display:flex;width:100%;text-align:left;gap:10px;align-items:center;
  padding:11px 15px;border-bottom:1px solid var(--line);font-size:15px;
}
.suggest button:last-child{border-bottom:none}
.suggest button:hover,.suggest button.on{background:var(--accent-soft);color:var(--accent-ink)}
.suggest .r{margin-left:auto;font-size:12px;color:var(--muted)}

/* ---------- liste de courses ---------- */
.aisle{margin-bottom:22px}
.aisle-head{display:flex;align-items:center;gap:10px;margin:0 0 10px;padding:0 2px}
.aisle-head .pic{
  width:30px;height:30px;flex:none;border-radius:10px;background:var(--ray-soft);
  display:grid;place-items:center;font-size:16px;line-height:1;
}
.aisle-head h3{
  font-family:"Bricolage Grotesque",sans-serif;font-size:15px;font-weight:700;margin:0;
  text-transform:none;letter-spacing:-.015em;color:var(--ray);
}
.aisle-head .rule{flex:1;height:2px;border-radius:2px;background:var(--ray-soft)}
.aisle-head .n{
  font-family:"DM Mono",monospace;font-size:11.5px;color:var(--ray);
  background:var(--ray-soft);border-radius:999px;padding:2px 9px;font-variant-numeric:tabular-nums;
}
.items{
  list-style:none;margin:0;padding:0;background:var(--surface);
  border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);
  border-left:4px solid var(--ray);
}
:root[data-theme="dark"] .items,
:root:not([data-theme="light"]) .items{box-shadow:inset 0 0 0 1px var(--line), var(--shadow)}
.item{border-bottom:1px solid var(--line);transition:background .12s}
.item:last-child{border-bottom:none}
.item:hover{background:var(--surface-2)}
.item-row{display:flex;align-items:center;gap:12px;padding:11px 14px}
.tick{
  width:27px;height:27px;flex:none;border-radius:50%;border:2px solid var(--line-strong);
  display:grid;place-items:center;background:var(--surface);transition:.14s;
}
.tick:hover{border-color:var(--ray);background:var(--ray-soft)}
.tick svg{width:14px;height:14px;stroke:var(--surface);fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .14s}
.item[data-done="1"] .tick{background:var(--ray);border-color:var(--ray)}
.item[data-done="1"] .tick svg{opacity:1;stroke:#FFFCF7}
:root[data-theme="dark"] .item[data-done="1"] .tick svg,
:root:not([data-theme="light"]) .item[data-done="1"] .tick svg{stroke:#16110D}
.item[data-done="1"]{background:color-mix(in srgb, var(--ray-soft) 45%, transparent)}
.item-body{flex:1;min-width:0;text-align:left;padding:2px 0}
.item-name{display:block;font-size:16px;line-height:1.3}
.item-from{display:block;font-size:12px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item[data-done="1"] .item-name{text-decoration:line-through;text-decoration-color:var(--ray);color:var(--muted)}
.qty{
  font-family:"DM Mono",ui-monospace,monospace;font-size:13px;flex:none;font-weight:500;
  background:var(--ray-soft);color:var(--ray);border-radius:999px;padding:4px 11px;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.item[data-done="1"] .qty{opacity:.45}
.editor{display:none;padding:0 14px 14px 53px;gap:8px;flex-wrap:wrap;align-items:center}
.item.editing .editor{display:flex}
.item.editing{background:var(--surface-2)}
.editor input[type="number"]{width:78px}
.editor input,.editor select{
  background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:8px 10px;font-size:14px;outline:none;
}
.editor input:focus,.editor select:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.editor input[name="unit"]{width:84px}
.editor select{flex:1;min-width:130px}
.editor .rm{color:var(--danger);font-size:13px;font-weight:700;padding:7px 12px;border-radius:999px}

/* --------------------------- utilitaires --------------------------- */
const $ = s => document.querySelector(s);
const norm = s => (s||"").toString().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const esc = s => (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function slug(s){
  const out = norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60);
  return out || "x";
}
function itemId(name, unit){ return slug(name) + "--" + slug(unit||"u"); }
function fmtQty(n){
  if(n==null || isNaN(n)) return "";
  const r = Math.round(n*100)/100;
  return String(r).replace(".",",");
}
function guessRayon(name){
  /* Le mot le plus long gagne, avec une prime au mot de tête : « jus d'orange »
     part aux boissons, « lait de coco » reste en épicerie. */
  const n = " " + norm(name) + " ";
  let best = "divers", score = 0;
  for(const [rayon, words] of Object.entries(GUESS)){
    for(const w of words){
      const at = n.indexOf(w);
      if(at < 0) continue;
      const s = w.length + (at === 1 ? 4 : 0);
      if(s > score){ best = rayon; score = s; }
    }
  }
  return best;
}
function parseQuick(text){
  let rest = (text||"").trim().replace(/\s+/g," ");
  let qty = null, unit = "";
  const m = rest.match(/^(\d+(?:[.,]\d+)?|\d+\s*\/\s*\d+)\s*(.*)$/);
  if(m){
    const raw = m[1].replace(",",".");
    qty = raw.includes("/") ? (parseFloat(raw.split("/")[0]) / parseFloat(raw.split("/")[1])) : parseFloat(raw);
    rest = m[2];
    const u = rest.match(/^([^\s]+)\s+(.+)$/);
    if(u && UNITS.includes(norm(u[1]).replace(/\.$/,""))){ unit = u[1]; rest = u[2]; }
    else{
      const glued = m[2].match(/^(kg|g|mg|ml|cl|dl|l)\s*(.*)$/i);
      if(glued && glued[2]){ unit = glued[1].toLowerCase(); rest = glued[2]; }
    }
  }
  rest = rest.trim();
  if(rest) rest = rest.charAt(0).toUpperCase() + rest.slice(1);
  return {qty, unit, name:rest};
}
let toastTimer;
function toast(msg){
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2600);
}

/* ------------------------------ synchro ------------------------------
   Les trois collections vivent en local (localStorage) et, quand un foyer
   est configuré, dans une base Firebase Realtime Database via son API REST :
   flux d'événements en lecture (EventSource), PUT par document en écriture.
   Hors ligne, les écritures s'empilent dans une file et repartent au retour
   du réseau. Chaque document porte un updatedAt : le plus récent gagne.
--------------------------------------------------------------------- */
const COLS = ["recipes","shopping","plan"];
const LS_DATA = "panier.data.v1";
const LS_CFG  = "panier.foyer.v1";
const state = { recipes:new Map(), shopping:new Map(), plan:new Map(), tab:"recipes", editing:null, ready:false };

let localData = {recipes:{}, shopping:{}, plan:{}};
let queue = [];
let cfg = {url:"", code:""};
let es = null, esState = "off", firstSync = false, retryTimer = null;

function clean(body){
  const out = {};
  for(const [k,v] of Object.entries(body)){ if(k!=="id" && v!==undefined) out[k]=v; }
  return out;
}
function loadLocal(){
  try{
    const raw = JSON.parse(localStorage.getItem(LS_DATA) || "null");
    if(raw && raw.data){ localData = Object.assign({recipes:{},shopping:{},plan:{}}, raw.data); queue = raw.queue || []; }
  }catch(e){}
  try{ cfg = JSON.parse(localStorage.getItem(LS_CFG) || "null") || cfg; }catch(e){}
  const cutoff = Date.now() - 30*24*3600*1000;
  for(const col of COLS){
    for(const [id,d] of Object.entries(localData[col]||{})){
      if(d && d.deleted && (d.updatedAt||0) < cutoff) delete localData[col][id];
    }
  }
}
function persist(){
  try{ localStorage.setItem(LS_DATA, JSON.stringify({data:localData, queue})); }
  catch(e){ toast("Mémoire du téléphone pleine : videz des articles cochés."); }
}
function visible(col){
  const m = new Map();
  for(const [id,d] of Object.entries(localData[col]||{})){
    if(d && !d.deleted) m.set(id, Object.assign({}, d, {id}));
  }
  return m;
}
function emit(col){
  state[col] = visible(col);
  state.ready = true;
  render();
}
function save(col, id, body){
  localData[col][id] = Object.assign(clean(body), {updatedAt:Date.now()});
  persist(); emit(col); pushDoc(col, id);
  return Promise.resolve();
}
function drop(col, id){
  localData[col][id] = {deleted:true, updatedAt:Date.now()};
  persist(); emit(col); pushDoc(col, id);
  return Promise.resolve();
}

/* ---- écritures distantes ---- */
function roomUrl(suffix){
  return cfg.url.replace(/\/+$/,"") + "/f/" + cfg.code + (suffix||"") + ".json";
}
function pushDoc(col, id){
  if(!cfg.url || !cfg.code) return;
  if(!queue.some(q=>q.col===col && q.id===id)) queue.push({col, id});
  persist(); flush();
}
let flushing = false;
async function flush(){
  if(flushing || !cfg.url || !cfg.code || !queue.length) return;
  if(navigator.onLine === false){ updateSync(); return; }
  flushing = true;
  try{
    while(queue.length){
      const {col, id} = queue[0];
      const doc = localData[col][id];
      if(!doc){ queue.shift(); continue; }
      const res = await fetch(roomUrl("/" + col + "/" + id), {
        method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(doc)
      });
      if(!res.ok){
        if(res.status === 401 || res.status === 403) toast("Écriture refusée : vérifiez les règles de la base.");
        break;
      }
      queue.shift();
    }
  }catch(e){ /* hors ligne : on retentera */ }
  flushing = false;
  persist(); updateSync();
  if(queue.length && !retryTimer){
    retryTimer = setTimeout(()=>{ retryTimer = null; flush(); }, 15000);
  }
}
window.addEventListener("online", ()=>{ flush(); connect(); });
window.addEventListener("offline", updateSync);

/* ---- lecture temps réel ---- */
function mergeDoc(col, id, doc){
  const cur = localData[col][id];
  if(doc == null){
    if(cur){ delete localData[col][id]; return true; }
    return false;
  }
  if(typeof doc !== "object") return false;
  if(cur && (cur.updatedAt||0) > (doc.updatedAt||0)) return false;
  if(cur && JSON.stringify(cur) === JSON.stringify(doc)) return false;
  localData[col][id] = doc;
  return true;
}
function pushMissing(remote){
  for(const col of COLS){
    const far = (remote && remote[col]) || {};
    for(const [id, doc] of Object.entries(localData[col]||{})){
      const other = far[id];
      if(!other || (other.updatedAt||0) < (doc.updatedAt||0)) pushDoc(col, id);
    }
  }
}
function onStream(ev){
  let msg;
  try{ msg = JSON.parse(ev.data); }catch(e){ return; }
  if(!msg || msg.path === undefined) return;
  esState = "live";
  const parts = String(msg.path).split("/").filter(Boolean);
  const data = msg.data;
  const touched = new Set();
  if(parts.length === 0){
    const remote = data || {};
    for(const col of COLS){
      for(const [id, doc] of Object.entries(remote[col] || {})){
        if(mergeDoc(col, id, doc)) touched.add(col);
      }
    }
    if(!firstSync){ firstSync = true; pushMissing(remote); }
  } else if(parts.length === 1){
    if(!COLS.includes(parts[0])) return;
    for(const [id, doc] of Object.entries(data || {})){
      if(mergeDoc(parts[0], id, doc)) touched.add(parts[0]);
    }
  } else {
    if(!COLS.includes(parts[0])) return;
    if(mergeDoc(parts[0], parts[1], data)) touched.add(parts[0]);
  }
  if(touched.size){ persist(); for(const col of touched) emit(col); }
  updateSync();
}
function connect(){
  if(es){ try{ es.close(); }catch(e){} es = null; }
  if(!cfg.url || !cfg.code){ esState = "off"; updateSync(); return; }
  firstSync = false;
  esState = "wait"; updateSync();
  try{ es = new EventSource(roomUrl()); }
  catch(e){ esState = "wait"; updateSync(); return; }
  es.addEventListener("open", ()=>{ esState = "live"; updateSync(); });
  es.addEventListener("error", ()=>{ esState = "wait"; updateSync(); });
  es.addEventListener("put", onStream);
  es.addEventListener("patch", onStream);
  es.addEventListener("cancel", ()=>{
    esState = "wait"; updateSync();
    toast("Lecture refusée : vérifiez les règles de la base.");
  });
  flush();
}
function updateSync(){
  const el = document.getElementById("sync");
  const label = document.getElementById("syncLabel");
  if(!el) return;
  if(!cfg.url || !cfg.code){ el.dataset.state = "local"; label.textContent = "Ce téléphone"; return; }
  if(queue.length){ el.dataset.state = "wait"; label.textContent = queue.length + " en attente"; return; }
  if(esState === "live"){ el.dataset.state = "live"; label.textContent = "Foyer"; return; }
  el.dataset.state = "wait"; label.textContent = "Reconnexion";
}
function saveCfg(next){
  cfg = next;
  try{ localStorage.setItem(LS_CFG, JSON.stringify(cfg)); }catch(e){}
  connect();
}
function makeCode(){
  const a = "abcdefghijklmnopqrstuvwxyz0123456789";
  const buf = new Uint32Array(16);
  (window.crypto || window.msCrypto).getRandomValues(buf);
  return [...buf].map(n=>a[n % a.length]).join("");
}
function inviteLink(){
  const payload = btoa(JSON.stringify(cfg)).replace(/=+$/,"");
  return location.origin + location.pathname + "#f=" + encodeURIComponent(payload);
}

/* --------------------------- liste de courses --------------------------- */
function itemTotal(it){
  let total = 0, seen = false;
  if(it.manualQty){ total += Number(it.manualQty)||0; seen = true; }
  for(const v of Object.values(it.sources||{})){
    if(v!=null && !isNaN(v)){ total += Number(v); seen = true; }
  }
  return seen ? total : null;
}
function itemFrom(it){
  const names = Object.keys(it.sources||{}).map(rid=>{
    const r = state.recipes.get(rid); return r ? r.name : null;
  }).filter(Boolean);
  if(it.manualQty) names.unshift("Ajouté à la volée");
  return names.join(" · ");
}
async function addManual(name, qty, unit, rayon){
  if(!name) return;
  const id = itemId(name, unit);
  const cur = state.shopping.get(id);
  const body = cur ? Object.assign({}, cur) : {name, unit:unit||"", rayon:rayon||guessRayon(name), sources:{}, manualQty:0, done:false, createdAt:Date.now()};
  body.sources = Object.assign({}, body.sources||{});
  const add = (qty==null ? (itemTotal(body)==null ? null : 1) : qty);
  if(add!=null) body.manualQty = (Number(body.manualQty)||0) + add;
  body.done = false;
  body.name = body.name || name;
  await save("shopping", id, body);
  toast(add!=null ? `${fmtQty(add)} ${unit||""} ${name} ajouté`.replace(/\s+/g," ") : `${name} ajouté`);
}
async function recipeToList(recipe, servings){
  const factor = (servings||recipe.servings||1) / (recipe.servings||1);
  for(const ing of (recipe.ingredients||[])){
    const id = itemId(ing.name, ing.unit);
    const cur = state.shopping.get(id);
    const body = cur ? Object.assign({}, cur) : {name:ing.name, unit:ing.unit||"", rayon:ing.rayon||guessRayon(ing.name), sources:{}, manualQty:0, done:false, createdAt:Date.now()};
    body.sources = Object.assign({}, body.sources||{});
    body.sources[recipe.id] = ing.qty==null ? null : Math.round(ing.qty*factor*100)/100;
    body.done = false;
    await save("shopping", id, body);
  }
  await save("recipes", recipe.id, Object.assign({}, recipe, {inList:true, listServings:servings||recipe.servings||null}));
}
async function recipeOffList(recipe){
  for(const [id, it] of state.shopping){
    if(!it.sources || !(recipe.id in it.sources)) continue;
    const sources = Object.assign({}, it.sources);
    delete sources[recipe.id];
    if(Object.keys(sources).length === 0 && !it.manualQty) await drop("shopping", id);
    else await save("shopping", id, Object.assign({}, it, {sources}));
  }
  await save("recipes", recipe.id, Object.assign({}, recipe, {inList:false, listServings:null}));
}

function renderList(){
  const wrap = $("#shopList");
  const items = [...state.shopping.values()];
  if(!items.length){
    wrap.innerHTML = state.ready
      ? '<div class="empty"><span class="pic" aria-hidden="true">🧺</span><strong>Liste vide</strong>Tapez ce qu’il vous faut dans la barre ci-dessus — « 2 kg pommes de terre », « 6 œufs » — ou cochez une recette dans l’onglet Recettes.</div>'
      : '<div class="empty">Chargement…</div>';
    return;
  }
  const byRayon = new Map();
  for(const it of items){
    const r = RAYON_NAME[it.rayon] ? it.rayon : "divers";
    if(!byRayon.has(r)) byRayon.set(r, []);
    byRayon.get(r).push(it);
  }
  let html = "";
  for(const [key, label] of RAYONS){
    const list = byRayon.get(key);
    if(!list) continue;
    list.sort((a,b)=> (a.done?1:0)-(b.done?1:0) || (a.name||"").localeCompare(b.name||"","fr"));
    const left = list.filter(i=>!i.done).length;
    html += '<section class="aisle" data-rayon="' + esc(key) + '">' +
            '<div class="aisle-head"><span class="pic" aria-hidden="true">' + (RAYON_PIC[key] || "") + '</span>' +
            '<h3>' + esc(label) + '</h3><span class="rule"></span>' +
            '<span class="n">' + left + "/" + list.length + '</span></div><ul class="items">';
    for(const it of list){
      const total = itemTotal(it);
      const from = itemFrom(it);
      html += '<li class="item' + (state.editing === it.id ? " editing" : "") + '" data-done="' + (it.done?1:0) + '" data-id="' + esc(it.id) + '">' +
        '<div class="item-row">' +
          '<button class="tick" data-act="tick" data-id="' + esc(it.id) + '" aria-pressed="' + (it.done?"true":"false") + '" aria-label="Cocher ' + esc(it.name) + '">' + ICON_CHECK + '</button>' +
          '<button class="item-body" data-act="edit-item" data-id="' + esc(it.id) + '">' +
            '<span class="item-name">' + esc(it.name) + '</span>' +
            (from ? '<span class="item-from">' + esc(from) + '</span>' : "") +
          '</button>' +
          (total!=null ? '<span class="qty">' + esc(fmtQty(total) + (it.unit ? " " + it.unit : "")) + '</span>' : "") +
        '</div>' +
        '<div class="editor">' +
          '<input type="number" step="any" min="0" name="qty" value="' + (total!=null?esc(total):"") + '" data-id="' + esc(it.id) + '" aria-label="Quantité" placeholder="qté">' +
          '<input name="unit" value="' + esc(it.unit||"") + '" data-id="' + esc(it.id) + '" aria-label="Unité" placeholder="unité">' +
          '<select name="rayon" data-id="' + esc(it.id) + '" aria-label="Rayon">' +
            RAYONS.map(([k,l])=>'<option value="' + k + '"' + (k===(it.rayon||"divers")?" selected":"") + '>' + esc(l) + '</option>').join("") +
          '</select>' +
          '<button class="rm" data-act="remove-item" data-id="' + esc(it.id) + '">Supprimer</button>' +
        '</div></li>';
    }
    html += "</ul></section>";
  }
  wrap.innerHTML = html;
}

  $("#weekList").innerHTML = DAYS.map((day, i)=>{
    const slots = SLOTS.map(([key,label])=>{
      const p = state.plan.get("d" + i + "_" + key);
      const name = p && p.recipeId && state.recipes.get(p.recipeId) ? state.recipes.get(p.recipeId).name : (p && p.name) || "";
      return '<button class="slot" data-act="pick" data-slot="d' + i + "_" + key + '">' +
        '<span class="when">' + label + '</span>' +
        '<span class="what' + (name ? "" : " none") + '">' + (name ? esc(name) : "à décider") + '</span>' +
        '<svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>';
    }).join("");
    return '<article class="day' + (i===today ? " today" : "") + '"><div class="day-name">' + day + '</div>' + slots + '</article>';
  }).join("");
}

async function saveRecipe(){
  const form = document.getElementById("recipeForm");
  if(!form) return;
  const fld = n => form.querySelector('[name="' + n + '"]');
  const name = fld("name").value.trim();
  if(!name){ fld("name").focus(); toast("Il manque le nom de la recette."); return; }
  const ingredients = [...document.querySelectorAll("#ingRows .ingrow")].map(row=>{
    const n = row.querySelector('[name="n"]').value.trim();
    if(!n) return null;
    const qRaw = row.querySelector('[name="q"]').value.trim().replace(",",".");
    const q = qRaw === "" ? null : parseFloat(qRaw);
    const u = row.querySelector('[name="u"]').value.trim();
    return {name:n, qty:(q!=null && !isNaN(q)) ? q : null, unit:u, rayon:guessRayon(n)};
  }).filter(Boolean);
  const steps = fld("steps").value.split("\n").map(s=>s.trim().replace(/^\d+[.)]\s*/,"")).filter(Boolean);
  const id = slug(name) + "-" + Math.random().toString(36).slice(2,6);
  await save("recipes", id, {
    name, category:fld("category").value, servings:parseInt(fld("servings").value,10)||4,
    minutes:parseInt(fld("minutes").value,10)||null, ingredients, steps, inList:false, createdAt:Date.now()

}

/* --------------------------- barre de recherche --------------------------- */
function catalog(){
  const out = new Map();
  for(const [rayon, words] of Object.entries(GUESS)){
    for(const w of words) out.set(w, {name:w.charAt(0).toUpperCase()+w.slice(1), rayon});
  }
  for(const r of state.recipes.values()){
    for(const ing of (r.ingredients||[])) out.set(norm(ing.name), {name:ing.name, rayon:ing.rayon||guessRayon(ing.name), unit:ing.unit});
  }
  for(const it of state.shopping.values()) out.set(norm(it.name), {name:it.name, rayon:it.rayon, unit:it.unit});
  return [...out.values()];
}
function refreshAddBar(){
  const raw = $("#addInput").value;
  const p = parseQuick(raw);
  const parsed = $("#parsed");
  const sug = $("#suggest");
  if(!raw.trim()){ parsed.hidden = true; sug.hidden = true; return; }
  if(p.name){
    parsed.hidden = false;
    parsed.innerHTML = (p.qty!=null ? '<b>' + esc(fmtQty(p.qty) + (p.unit ? " " + p.unit : "")) + '</b>' : '<b>1</b>') +
      '<span>' + esc(p.name) + '</span><span class="ray">→ ' + esc(RAYON_NAME[guessRayon(p.name)]) + '</span>';
  } else parsed.hidden = true;
  const q = norm(p.name);
  const hits = q.length >= 2 ? catalog().filter(c=>norm(c.name).includes(q)).slice(0,6) : [];
  if(!hits.length){ sug.hidden = true; return; }
  sug.hidden = false;
  sug.innerHTML = hits.map(c=>'<button type="button" data-act="suggest" data-name="' + esc(c.name) + '" data-rayon="' + esc(c.rayon||"divers") + '" data-unit="' + esc(c.unit||"") + '">' +
    esc(c.name) + '<span class="r">' + esc(RAYON_NAME[c.rayon]||"Divers") + '</span></button>').join("");
}

/* ------------------------------ événements ------------------------------ */
document.addEventListener("click", async (ev)=>{
  const btn = ev.target.closest("[data-act]");
  if(!btn){
    if(!ev.target.closest(".addbar")) $("#suggest").hidden = true;
    return;
  }
  const act = btn.dataset.act, id = btn.dataset.id;
  if(act === "close"){ closeSheet(); return; }

  if(act === "sync"){ openSyncSheet(); return; }
  if(act === "gen-code"){ document.getElementById("dbCode").value = makeCode(); return; }
  if(act === "test-sync"){
    const out = document.getElementById("syncTest");
    const url = document.getElementById("dbUrl").value.trim().replace(/\/+$/,"");
    const code = document.getElementById("dbCode").value.trim();
    const say = (cls, title, detail) => {
      out.hidden = false; out.className = "testout" + (cls ? " " + cls : "");
      out.innerHTML = "<b>" + esc(title) + "</b>" + detail;
    };
    if(!url){ say("ko", "Adresse manquante", "Collez d\'abord l\'adresse de la base."); return; }
    if(!/firebasedatabase\.app|firebaseio\.com|localhost|127\./.test(url)){
      say("ko", "Ce n\'est pas une Realtime Database",
        "L\'adresse d\'une Realtime Database finit par <code>firebasedatabase.app</code> ou <code>firebaseio.com</code>. Une base <b>Firestore</b> ne convient pas : c\'est un autre produit, sans l\'API utilisée ici. Dans la console Firebase, menu <b>Realtime Database</b> — pas <b>Firestore Database</b>.");
      return;
    }
    say("", "Test en cours…", "");
    try{
      const stop = new AbortController();
      const timer = setTimeout(()=>stop.abort(), 8000);
      const res = await fetch(url + "/f/" + encodeURIComponent(code || "test") + ".json", {signal:stop.signal});
      const body = (await res.text()).slice(0, 300);
      clearTimeout(timer);
      if(res.ok){
        say("ok", "Connexion réussie",
          body === "null"
            ? "La base répond et le foyer est encore vide — c\'est normal avant le premier ajout. Enregistrez, la pastille doit passer à « Foyer »."
            : "La base répond et contient déjà des données.");
      } else if(res.status === 401 || res.status === 403){
        say("ko", "Lecture refusée par les règles",
          "La base existe mais refuse l\'accès. Retournez dans l\'onglet <b>Règles</b>, collez exactement celles indiquées plus haut, puis <b>Publier</b>. Vérifiez aussi que le code du foyer fait au moins 12 caractères. Réponse : <code>" + esc(body) + "</code>");
      } else if(res.status === 404){
        say("ko", "Adresse introuvable",
          "Aucune base à cette adresse. Recopiez celle affichée en haut de l\'écran Realtime Database, sans rien ajouter après. Réponse : <code>" + esc(body) + "</code>");
      } else {
        say("ko", "Erreur HTTP " + res.status, "<code>" + esc(body) + "</code>");
      }
    }catch(e){
      say("ko", e && e.name === "AbortError" ? "Pas de réponse en 8 secondes" : "Aucune réponse",
        "L\'adresse ne répond pas : faute de frappe, base supprimée, ou téléphone hors ligne.");
    }
    return;
  }
  if(act === "save-sync"){
    const url = document.getElementById("dbUrl").value.trim().replace(/\/+$/,"");
    const code = document.getElementById("dbCode").value.trim().replace(/[^a-zA-Z0-9_-]/g,"");
    if(url && !/^https:\/\/.+/.test(url) && !/^http:\/\/(localhost|127\.)/.test(url)){ toast("L'adresse doit commencer par https://"); return; }
    if(url && code.length < 12){ toast("Le code du foyer fait au moins 12 caractères."); return; }
    saveCfg({url, code});
    closeSheet();
    toast(url ? "Foyer enregistré, synchronisation en route" : "Synchronisation désactivée");
    return;
  }
  if(act === "copy-invite"){
    const field = document.getElementById("invite");
    const link = field ? field.value : inviteLink();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(link).then(()=>toast("Lien copié"), ()=>{ if(field){field.select();} toast("Copiez le lien sélectionné"); });
    } else if(field){ field.select(); document.execCommand("copy"); toast("Lien copié"); }
    return;
  }
  if(act === "leave-foyer"){
    saveCfg({url:"", code:""});
    closeSheet();
    toast("Ce téléphone n'est plus relié");
    return;
  }
  if(act === "new-recipe"){ openNewRecipe(); return; }
  if(act === "save-recipe"){ await saveRecipe(); return; }
  if(act === "rm-ing"){
    const rows = document.querySelectorAll("#ingRows .ingrow");
    if(rows.length > 1) btn.closest(".ingrow").remove(); else btn.closest(".ingrow").querySelectorAll("input").forEach(i=>i.value="");
    return;
  }
  if(act === "open-recipe"){ openRecipe(id); return; }
  if(act === "toggle-recipe"){
    const r = state.recipes.get(id); if(!r) return;
    if(r.inList){ await recipeOffList(r); toast("Ingrédients retirés des courses"); }
    else { await recipeToList(r, r.servings); toast("Ingrédients ajoutés aux courses"); }
    if($("#scrim").classList.contains("open")) closeSheet();
    return;
  }
  if(act === "add-servings"){
    const r = state.recipes.get(id); if(!r) return;
    await recipeToList(r, sheetServings);
    closeSheet(); toast("Ingrédients ajoutés pour " + sheetServings + " personnes");
    return;
  }
  if(act === "del-recipe"){
    const r = state.recipes.get(id); if(!r) return;
    if(r.inList) await recipeOffList(r);
    await drop("recipes", id);
    for(const [slotId, p] of state.plan){ if(p.recipeId === id) await drop("plan", slotId); }
    closeSheet(); toast("Recette supprimée");
    return;
  }
  if(act === "serv-" || act === "serv+"){
    const open = state.recipes.get(sheetRecipeId);
    if(!open) return;
    sheetServings = Math.max(1, Math.min(30, sheetServings + (act === "serv+" ? 1 : -1)));
    $("#sheet").innerHTML = recipeSheetHTML(open);
    return;
  }

  if(act === "tick"){
    const it = state.shopping.get(id); if(!it) return;
    await save("shopping", id, Object.assign({}, it, {done:!it.done}));
    return;
  }
  if(act === "edit-item"){
    state.editing = state.editing === id ? null : id;
    renderList();
    const input = document.querySelector('.item.editing input[name="qty"]');
    if(input) input.focus();
    return;
  }
  if(act === "remove-item"){
    state.editing = null;
    await drop("shopping", id);
    return;
  }
  if(act === "clear-done"){
    for(const [iid, it] of [...state.shopping]) if(it.done) await drop("shopping", iid);
    toast("Articles cochés retirés");
    return;
  }
  if(act === "suggest"){
    const p = parseQuick($("#addInput").value);
    await addManual(btn.dataset.name, p.qty, p.unit || btn.dataset.unit || "", btn.dataset.rayon);
    $("#addInput").value = ""; refreshAddBar(); $("#addInput").focus();
    return;
  }

  if(act === "pick"){ openPicker(btn.dataset.slot); return; }
  if(act === "set-slot"){
    const slot = btn.dataset.slot;
    if(!id) await drop("plan", slot);
    else{
      const r = state.recipes.get(id);
      await save("plan", slot, {recipeId:id, name:r ? r.name : "", updatedAt:Date.now()});
    }
    closeSheet();
    return;
  }
  if(act === "clear-week"){
    for(const [slotId] of [...state.plan]) await drop("plan", slotId);
    toast("Semaine vidée");
    return;
  }
  if(act === "week-to-list"){
    const ids = new Set([...state.plan.values()].map(p=>p.recipeId).filter(Boolean));
    let n = 0;
    for(const rid of ids){
      const r = state.recipes.get(rid);
      if(r && !r.inList){ await recipeToList(r, r.servings); n++; }
    }
    toast(n ? n + (n>1 ? " recettes ajoutées aux courses" : " recette ajoutée aux courses") : "Tout est déjà dans la liste");
    return;
  }
});

(function boot(){
  loadLocal();
  const m = location.hash.match(/[#&]f=([^&]+)/);
  if(m){
    try{
      const next = JSON.parse(atob(decodeURIComponent(m[1])));
      if(next && next.url && next.code){
        cfg = next;
        localStorage.setItem(LS_CFG, JSON.stringify(cfg));
        setTimeout(()=>toast("Foyer rejoint — les deux téléphones partagent la même liste."), 700);
      }
    }catch(e){}
    history.replaceState(null, "", location.pathname + location.search);
  }
  const vide = COLS.every(c=>Object.keys(localData[c]||{}).length === 0);
  if(vide && !cfg.url){
    const now = Date.now();
    for(const r of STARTERS) localData.recipes[r.id] = Object.assign({}, r, {createdAt:now, updatedAt:now});
    persist();
  }
  for(const col of COLS) state[col] = visible(col);
  state.ready = true;
  render();
  updateSync();
  connect();
  if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
})();

})();
</script>

</body>
</html>
