<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panier Commun</title>
<meta name="description" content="Recettes, liste de courses triée par rayon et repas de la semaine, partagés entre deux téléphones.">
<meta name="theme-color" content="#FBF5EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16110D" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Panier">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Karla:ital,wght@0,400;0,500;0,700;1,400&family=DM+Mono:wght@400;500&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
</style>
</head>
<body>
<style>
/* =================================================================
   Panier Commun — habillage « marché »
   Fond papier chaud, cartes sans filet, un ton par rayon.
   Aucune règle ne dépend de la logique : seuls les noms de classes
   déjà produits par le rendu sont stylés.
================================================================= */
:root{
  --ground:#FBF5EC;
  --ground-tint:#F2E7D7;
  --surface:#FFFCF7;
  --surface-2:#F7EFE3;
  --ink:#241C15;
  --muted:#7C6A58;
  --line:#EBDFCE;
  --line-strong:#DCC9B0;
  --accent:#2F6E4F;
  --accent-ink:#1E4E37;
  --accent-soft:#DFEFE2;
  --warm:#C4552E;
  --warm-soft:#FAE2D5;
  --citron:#A0710F;
  --citron-soft:#F8EACB;
  --danger:#B03A22;
  --shadow:0 1px 1px rgba(70,48,24,.04), 0 10px 22px -16px rgba(70,48,24,.5);
  --shadow-lift:0 2px 3px rgba(70,48,24,.05), 0 22px 40px -26px rgba(70,48,24,.65);
  --radius:20px;
  --radius-sm:13px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#16110D;
    --ground-tint:#1F1811;
    --surface:#221A14;
    --surface-2:#2B211A;
    --ink:#F2E8DB;
    --muted:#A4917C;
    --line:#352A21;
    --line-strong:#493A2D;
    --accent:#7BC79B;
    --accent-ink:#A6DCBC;
    --accent-soft:#1D3A2B;
    --warm:#EE9370;
    --warm-soft:#3B241A;
    --citron:#E3BE72;
    --citron-soft:#332716;
    --danger:#E68A6C;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 26px -18px rgba(0,0,0,.95);
    --shadow-lift:0 2px 4px rgba(0,0,0,.5), 0 24px 44px -26px #000;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#16110D;
  --ground-tint:#1F1811;
  --surface:#221A14;
  --surface-2:#2B211A;
  --ink:#F2E8DB;
  --muted:#A4917C;
  --line:#352A21;
  --line-strong:#493A2D;
  --accent:#7BC79B;
  --accent-ink:#A6DCBC;
  --accent-soft:#1D3A2B;
  --warm:#EE9370;
  --warm-soft:#3B241A;
  --citron:#E3BE72;
  --citron-soft:#332716;
  --danger:#E68A6C;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 26px -18px rgba(0,0,0,.95);
  --shadow-lift:0 2px 4px rgba(0,0,0,.5), 0 24px 44px -26px #000;
  color-scheme:dark;
}

/* Nuancier : un ton par rayon, choisi parmi ces dix teintes. Porté par
   l'élément qui déclare data-swatch, hérité par ses enfants. */
[data-swatch]        {--ray:#7A6A5A;--ray-soft:#EFE6DA}
[data-swatch="leaf"] {--ray:#3E8E4F;--ray-soft:#E2F2DE}
[data-swatch="rose"] {--ray:#B8483F;--ray-soft:#FBE3DF}
[data-swatch="amber"]{--ray:#A8801B;--ray-soft:#FAEFD1}
[data-swatch="crust"]{--ray:#98682F;--ray-soft:#F6E7D2}
[data-swatch="olive"]{--ray:#6D7A2B;--ray-soft:#EDF1D7}
[data-swatch="berry"]{--ray:#A24479;--ray-soft:#F8E2EF}
[data-swatch="ice"]  {--ray:#2F7391;--ray-soft:#DCEDF5}
[data-swatch="indigo"]{--ray:#5B5BA6;--ray-soft:#E6E6F7}
[data-swatch="teal"] {--ray:#457C79;--ray-soft:#DDEEEC}
[data-swatch="stone"]{--ray:#7A6A5A;--ray-soft:#EFE6DA}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) [data-swatch]        {--ray:#C2AE96;--ray-soft:#2E2419}
  :root:not([data-theme="light"]) [data-swatch="leaf"] {--ray:#7EC98C;--ray-soft:#1B2E1E}
  :root:not([data-theme="light"]) [data-swatch="rose"] {--ray:#EB8E84;--ray-soft:#33201D}
  :root:not([data-theme="light"]) [data-swatch="amber"]{--ray:#E0BC5E;--ray-soft:#312716}
  :root:not([data-theme="light"]) [data-swatch="crust"]{--ray:#D8A56C;--ray-soft:#2F2419}
  :root:not([data-theme="light"]) [data-swatch="olive"]{--ray:#B5C46C;--ray-soft:#272B17}
  :root:not([data-theme="light"]) [data-swatch="berry"]{--ray:#DE8FBB;--ray-soft:#311F2A}
  :root:not([data-theme="light"]) [data-swatch="ice"]  {--ray:#79BBD6;--ray-soft:#17282F}
  :root:not([data-theme="light"]) [data-swatch="indigo"]{--ray:#A0A0E0;--ray-soft:#20203A}
  :root:not([data-theme="light"]) [data-swatch="teal"] {--ray:#7CC2BE;--ray-soft:#182B2A}
  :root:not([data-theme="light"]) [data-swatch="stone"]{--ray:#C2AE96;--ray-soft:#2E2419}
}
:root[data-theme="dark"] [data-swatch]        {--ray:#C2AE96;--ray-soft:#2E2419}
:root[data-theme="dark"] [data-swatch="leaf"] {--ray:#7EC98C;--ray-soft:#1B2E1E}
:root[data-theme="dark"] [data-swatch="rose"] {--ray:#EB8E84;--ray-soft:#33201D}
:root[data-theme="dark"] [data-swatch="amber"]{--ray:#E0BC5E;--ray-soft:#312716}
:root[data-theme="dark"] [data-swatch="crust"]{--ray:#D8A56C;--ray-soft:#2F2419}
:root[data-theme="dark"] [data-swatch="olive"]{--ray:#B5C46C;--ray-soft:#272B17}
:root[data-theme="dark"] [data-swatch="berry"]{--ray:#DE8FBB;--ray-soft:#311F2A}
:root[data-theme="dark"] [data-swatch="ice"]  {--ray:#79BBD6;--ray-soft:#17282F}
:root[data-theme="dark"] [data-swatch="indigo"]{--ray:#A0A0E0;--ray-soft:#20203A}
:root[data-theme="dark"] [data-swatch="teal"] {--ray:#7CC2BE;--ray-soft:#182B2A}
:root[data-theme="dark"] [data-swatch="stone"]{--ray:#C2AE96;--ray-soft:#2E2419}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:"Karla","Helvetica Neue",Arial,sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.app{
  max-width:620px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
  background:var(--ground);position:relative;
}

/* ---------- bandeau ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  padding:16px 18px 12px;
  background:
    radial-gradient(120% 150% at 0% 0%, var(--accent-soft) 0%, transparent 58%),
    radial-gradient(100% 130% at 100% 0%, var(--warm-soft) 0%, transparent 52%),
    color-mix(in srgb, var(--ground) 86%, transparent);
  backdrop-filter:blur(12px) saturate(1.15);
}
.topbar::after{
  content:"";position:absolute;left:14px;right:14px;bottom:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--line-strong) 18%,var(--line-strong) 82%,transparent);
}
.brandrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{
  font-family:"Bricolage Grotesque","Karla",sans-serif;
  font-weight:700;font-size:27px;letter-spacing:-.035em;margin:0;line-height:1.05;
  font-variation-settings:"opsz" 32;
}
.brand span{color:var(--accent)}
.sync{
  margin-left:auto;display:inline-flex;align-items:center;gap:7px;
  font-size:12px;font-weight:500;color:var(--muted);
  border:1px solid var(--line-strong);border-radius:999px;padding:5px 12px;
  background:var(--surface);box-shadow:var(--shadow);transition:.15s;
}
.sync:hover{border-color:var(--accent);color:var(--accent)}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync[data-state="live"]{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:var(--accent-soft)}
.sync[data-state="live"] .dot{background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.sync[data-state="local"]{color:var(--citron);border-color:color-mix(in srgb,var(--citron) 38%,transparent);background:var(--citron-soft)}
.sync[data-state="local"] .dot{background:var(--citron)}

.viewhead{display:flex;align-items:center;gap:8px 10px;margin-top:12px;flex-wrap:wrap}
.viewhead h2{
  font-family:"Bricolage Grotesque","Karla",sans-serif;
  font-size:16px;font-weight:500;margin:0;letter-spacing:-.01em;color:var(--muted);white-space:nowrap;
}
.viewhead .count{
  font-size:12.5px;font-weight:500;color:var(--accent-ink);white-space:nowrap;
  background:var(--accent-soft);border-radius:999px;padding:3px 10px;
}
.viewhead .count:empty{display:none}
.headactions{margin-left:auto;display:flex;gap:8px}
.btn{
  border:1px solid var(--line-strong);border-radius:999px;padding:8px 15px;
  font-size:13.5px;font-weight:700;background:var(--surface);color:var(--ink);
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  box-shadow:var(--shadow);transition:transform .12s, box-shadow .12s, background .12s, color .12s;
}
.btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.btn:active{transform:none}
.btn-primary{background:var(--accent);border-color:transparent;color:#FFFCF7;box-shadow:0 2px 0 var(--accent-ink), var(--shadow)}
:root[data-theme="dark"] .btn-primary,
:root:not([data-theme="light"]) .btn-primary{color:#10231A;box-shadow:var(--shadow)}
.btn-primary:hover{background:var(--accent-ink);color:#FFFCF7;border-color:transparent}
:root[data-theme="dark"] .btn-primary:hover,
:root:not([data-theme="light"]) .btn-primary:hover{color:#10231A;filter:brightness(1.06)}
.btn-quiet{border-color:transparent;background:transparent;color:var(--muted);box-shadow:none;font-weight:500}
.btn-quiet:hover{color:var(--danger);background:var(--warm-soft);border-color:transparent;transform:none}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- vues ---------- */
.view{flex:1;padding:16px 18px 110px;display:none}
.view.active{display:block}

.empty{
  border-radius:var(--radius);
  padding:32px 24px;text-align:center;color:var(--muted);font-size:14.5px;line-height:1.6;
  background:
    radial-gradient(90% 120% at 50% 0%, var(--accent-soft) 0%, transparent 62%),
    var(--surface-2);
  box-shadow:inset 0 0 0 1px var(--line);
}
.empty .pic{display:block;font-size:34px;line-height:1;margin-bottom:10px}
.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:6px;font-family:"Bricolage Grotesque",sans-serif;letter-spacing:-.015em}

/* ---------- recettes ---------- */
.recipes{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.tile{
  display:flex;align-items:stretch;
  background:var(--surface);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;transition:transform .14s, box-shadow .14s;
  position:relative;
}
:root[data-theme="dark"] .tile,
:root:not([data-theme="light"]) .tile{box-shadow:inset 0 0 0 1px var(--line), var(--shadow)}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
:root[data-theme="dark"] .tile:hover,
:root:not([data-theme="light"]) .tile:hover{box-shadow:inset 0 0 0 1px var(--line-strong), var(--shadow-lift)}
.tile[data-inlist="1"]{background:linear-gradient(100deg,var(--accent-soft) 0 6px,var(--surface) 6px)}
.tile-open{flex:1;text-align:left;padding:15px 6px 15px 18px;display:block;min-width:0}
.tile-name{
  font-family:"Bricolage Grotesque","Karla",sans-serif;font-weight:700;font-size:18.5px;
  letter-spacing:-.02em;margin:0 0 5px;text-wrap:balance;line-height:1.2;
}
.tile-meta{font-size:13px;color:var(--muted);display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.tile-meta .cat{
  font-size:12px;font-weight:700;letter-spacing:0;text-transform:none;
  color:var(--citron);background:var(--citron-soft);border-radius:999px;padding:2px 10px;
}
.tile-meta .num{font-family:"DM Mono",ui-monospace,monospace;font-size:12.5px}
/* Une recette peut occuper plusieurs repas de la semaine ; la tuile le dit,
   et les courses n'en tiennent qu'une fois compte. */
.tile-meta .cat.wk{color:var(--accent-ink);background:var(--accent-soft)}
.tile-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--line-strong)}
.tile-check{
  width:74px;flex:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  color:var(--muted);font-size:11px;line-height:1.2;text-align:center;padding:8px 6px;
  border-left:1px dashed var(--line-strong);transition:.15s;
}
.tile-check .box{
  width:34px;height:34px;border-radius:12px;border:2px solid var(--line-strong);
  display:grid;place-items:center;background:var(--surface);transition:.15s;
}
.tile-check:hover .box{border-color:var(--accent);background:var(--accent-soft)}
.tile-check .box svg{width:19px;height:19px;stroke:var(--surface);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .15s}
.tile[data-inlist="1"] .tile-check{background:var(--accent-soft);color:var(--accent-ink);border-left-style:solid;border-left-color:transparent;font-weight:700}
.tile[data-inlist="1"] .tile-check .box{background:var(--accent);border-color:var(--accent)}
.tile[data-inlist="1"] .tile-check .box svg{opacity:1;stroke:#FFFCF7}
:root[data-theme="dark"] .tile[data-inlist="1"] .tile-check .box svg,
:root:not([data-theme="light"]) .tile[data-inlist="1"] .tile-check .box svg{stroke:#10231A}

/* ---------- recherche / ajout rapide ---------- */
.addbar{position:relative;margin-bottom:18px}
.addbar form{
  display:flex;gap:8px;align-items:center;
  background:var(--surface);border-radius:999px;padding:5px 5px 5px 16px;
  box-shadow:var(--shadow-lift);transition:box-shadow .15s;
}
:root[data-theme="dark"] .addbar form,
:root:not([data-theme="light"]) .addbar form{box-shadow:inset 0 0 0 1px var(--line-strong)}
.addbar form:focus-within{box-shadow:0 0 0 2px var(--accent), var(--shadow-lift)}
.addbar svg.mag{width:18px;height:18px;flex:none;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.addbar input{flex:1;min-width:0;border:none;background:none;padding:10px 0;outline:none;font-size:16px}
.addbar input::placeholder{color:var(--muted)}
.addbar .go{
  background:var(--accent);color:#FFFCF7;border-radius:999px;width:42px;height:42px;flex:none;
  display:grid;place-items:center;box-shadow:0 2px 0 var(--accent-ink);transition:.12s;
}
.addbar .go:hover{background:var(--accent-ink)}
:root[data-theme="dark"] .addbar .go,
:root:not([data-theme="light"]) .addbar .go{color:#10231A;box-shadow:none}
.addbar .go svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.parsed{
  font-size:13px;color:var(--muted);padding:9px 8px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
}
.parsed b{
  font-family:"DM Mono",ui-monospace,monospace;color:var(--ink);font-weight:500;
  background:var(--surface-2);border-radius:7px;padding:1px 7px;
}
.parsed .ray{color:var(--accent);font-weight:700}
.suggest{
  position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:20;
  background:var(--surface);border-radius:var(--radius-sm);
  box-shadow:var(--shadow-lift), inset 0 0 0 1px var(--line);overflow:hidden;max-height:46vh;overflow-y:auto;
}
.suggest button{
  display:flex;width:100%;text-align:left;gap:10px;align-items:center;
  padding:11px 15px;border-bottom:1px solid var(--line);font-size:15px;
}
.suggest button:last-child{border-bottom:none}
.suggest button:hover,.suggest button.on{background:var(--accent-soft);color:var(--accent-ink)}
.suggest .r{margin-left:auto;font-size:12px;color:var(--muted)}

/* ---------- liste de courses ---------- */
.aisle{margin-bottom:22px}
.aisle-head{display:flex;align-items:center;gap:10px;margin:0 0 10px;padding:0 2px}
.aisle-head .pic{
  width:30px;height:30px;flex:none;border-radius:10px;background:var(--ray-soft);
  display:grid;place-items:center;font-size:16px;line-height:1;
}
.aisle-head h3{
  font-family:"Bricolage Grotesque",sans-serif;font-size:15px;font-weight:700;margin:0;
  text-transform:none;letter-spacing:-.015em;color:var(--ray);
}
.aisle-head .rule{flex:1;height:2px;border-radius:2px;background:var(--ray-soft)}
.aisle-head .n{
  font-family:"DM Mono",monospace;font-size:11.5px;color:var(--ray);
  background:var(--ray-soft);border-radius:999px;padding:2px 9px;font-variant-numeric:tabular-nums;
}
.items{
  list-style:none;margin:0;padding:0;background:var(--surface);
  border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);
  border-left:4px solid var(--ray);
}
:root[data-theme="dark"] .items,
:root:not([data-theme="light"]) .items{box-shadow:inset 0 0 0 1px var(--line), var(--shadow)}
.item{border-bottom:1px solid var(--line);transition:background .12s}
.item:last-child{border-bottom:none}
.item:hover{background:var(--surface-2)}
.item-row{display:flex;align-items:center;gap:12px;padding:11px 14px}
.tick{
  width:27px;height:27px;flex:none;border-radius:50%;border:2px solid var(--line-strong);
  display:grid;place-items:center;background:var(--surface);transition:.14s;
}
.tick:hover{border-color:var(--ray);background:var(--ray-soft)}
.tick svg{width:14px;height:14px;stroke:var(--surface);fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .14s}
.item[data-done="1"] .tick{background:var(--ray);border-color:var(--ray)}
.item[data-done="1"] .tick svg{opacity:1;stroke:#FFFCF7}
:root[data-theme="dark"] .item[data-done="1"] .tick svg,
:root:not([data-theme="light"]) .item[data-done="1"] .tick svg{stroke:#16110D}
.item[data-done="1"]{background:color-mix(in srgb, var(--ray-soft) 45%, transparent)}
.item-body{flex:1;min-width:0;text-align:left;padding:2px 0}
.item-name{display:block;font-size:16px;line-height:1.3}
.item-from{display:block;font-size:12px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 👋 : la ligne a été tapée dans la barre d'ajout, aucune recette ne la
   demande. Sans ce repère, un article ajouté sans quantité n'affiche rien
   sous son nom et se lit comme le reste d'une recette disparue. */
.item-hand{font-size:13px;line-height:1;flex:none;opacity:.8}
.item[data-done="1"] .item-hand{opacity:.4}
.item[data-done="1"] .item-name{text-decoration:line-through;text-decoration-color:var(--ray);color:var(--muted)}
.qty{
  font-family:"DM Mono",ui-monospace,monospace;font-size:13px;flex:none;font-weight:500;
  background:var(--ray-soft);color:var(--ray);border-radius:999px;padding:4px 11px;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.item[data-done="1"] .qty{opacity:.45}
.editor{display:none;padding:0 14px 14px 53px;gap:8px;flex-wrap:wrap;align-items:center}
.item.editing .editor{display:flex}
.item.editing{background:var(--surface-2)}
.editor input[type="number"]{width:78px}
.editor input,.editor select{
  background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:8px 10px;font-size:14px;outline:none;
}
.editor input:focus,.editor select:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.editor input[name="unit"]{width:84px}
.editor select{flex:1;min-width:130px}
.editor .rm{color:var(--danger);font-size:13px;font-weight:700;padding:7px 12px;border-radius:999px}
.editor .rm:hover{background:var(--warm-soft)}
/* D'où vient la ligne : les recettes qui la fournissent et ce que chacune y
   met. Deux recettes qui demandent le même ingrédient ne font qu'une ligne —
   c'est ici qu'on lit le détail du total. */
.editor .from{flex-basis:100%;margin:2px 0 4px}
.editor .from-lab{
  display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:6px;
}
.editor .from ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.editor .from li{display:flex;align-items:baseline;gap:9px;font-size:13.5px;line-height:1.35}
.editor .from .who{flex:1;min-width:0}
.editor .from .howmuch{
  font-family:"DM Mono",ui-monospace,monospace;font-size:12px;flex:none;
  color:var(--ray);background:var(--ray-soft);border-radius:999px;padding:2px 9px;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.editor .from .note{font-size:12px;color:var(--muted);margin:7px 0 0}

/* ---------- semaine ---------- */
.days{display:flex;flex-direction:column;gap:12px}
.day{
  background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;
}
:root[data-theme="dark"] .day,
:root:not([data-theme="light"]) .day{box-shadow:inset 0 0 0 1px var(--line), var(--shadow)}
.day.today{box-shadow:0 0 0 2px var(--accent), var(--shadow-lift)}
.day-name{
  font-family:"Bricolage Grotesque",sans-serif;font-size:14.5px;font-weight:700;text-transform:none;
  letter-spacing:-.015em;padding:12px 16px 8px;color:var(--ink);display:flex;gap:9px;align-items:baseline;
}
.day.today .day-name{color:var(--accent-ink);background:var(--accent-soft)}
.day.today .day-name::after{
  content:"aujourd'hui";text-transform:none;letter-spacing:0;font-weight:700;font-size:11px;
  font-family:"Karla",sans-serif;color:var(--accent);background:var(--surface);
  border-radius:999px;padding:2px 9px;
}
.slot{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line);width:100%;text-align:left;transition:background .12s}
.slot .when{
  font-size:11.5px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--citron);
  background:var(--citron-soft);border-radius:999px;padding:3px 10px;width:auto;flex:none;
}
.slot .what{flex:1;min-width:0;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .what.none{color:var(--muted);font-style:normal;font-size:14.5px;opacity:.8}
.slot .chev{width:17px;height:17px;stroke:var(--line-strong);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.slot:hover{background:var(--surface-2)}
.slot:hover .chev{stroke:var(--accent);transform:translateX(2px)}
.slot .chev{transition:transform .14s, stroke .14s}

/* ---------- barre d'onglets ---------- */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  display:flex;gap:4px;max-width:620px;margin:0 auto;
  background:color-mix(in srgb, var(--surface) 90%, transparent);
  backdrop-filter:blur(14px) saturate(1.2);
  border-top:1px solid var(--line);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 6px;
  color:var(--muted);font-size:11.5px;font-weight:500;border-radius:14px;position:relative;transition:.15s;
}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab:hover{color:var(--ink)}
.tab[aria-current="true"]{color:var(--accent-ink);font-weight:700;background:var(--accent-soft)}
.tab[aria-current="true"] svg{stroke-width:2.2}
.tab .badge{
  position:absolute;top:3px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;
  background:var(--warm);color:#FFF8F4;border-radius:999px;font-size:10.5px;font-weight:700;
  display:grid;place-items:center;font-family:"DM Mono",monospace;
  box-shadow:0 0 0 2px var(--surface);
}

/* ---------- feuille de synchronisation ---------- */
.syncstate{margin:0 0 16px;font-size:14.5px;line-height:1.6;color:var(--muted)}
.syncstate.ok{color:var(--ink)}
.setup{border-radius:var(--radius-sm);background:var(--surface-2);margin-bottom:18px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.setup summary{
  padding:12px 15px;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--accent);
  letter-spacing:0;list-style:none;display:flex;align-items:center;gap:8px;
}
.setup summary::before{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
.setup[open] summary::before{transform:rotate(45deg)}
.setup summary::-webkit-details-marker{display:none}
.setup-steps{margin:0;padding:0 16px 14px 34px;font-size:14px;line-height:1.65;color:var(--ink)}
.setup-steps li{margin-bottom:10px}
.setup-steps b{font-weight:700}
.setup-steps pre{
  font-family:"DM Mono",ui-monospace,monospace;font-size:11.5px;line-height:1.5;
  background:var(--surface);border-radius:10px;box-shadow:inset 0 0 0 1px var(--line);
  padding:10px 12px;margin:8px 0 0;overflow-x:auto;
}
.testout{
  font-size:13.5px;line-height:1.55;border-radius:var(--radius-sm);padding:11px 14px;margin:-4px 0 16px;
  background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-strong);
  word-break:break-word;
}
.testout.ok{background:var(--accent-soft);color:var(--accent-ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.testout.ko{background:var(--warm-soft);color:var(--danger);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--danger) 35%,transparent)}
.testout b{display:block;margin-bottom:3px;color:inherit}
.testout code{font-family:"DM Mono",ui-monospace,monospace;font-size:12px}
.codewrap{display:flex;gap:8px}
.codewrap input{flex:1;min-width:0}
.wide{width:100%;justify-content:center}

/* ---------- feuilles ---------- */
.scrim{
  position:fixed;inset:0;z-index:50;background:rgba(36,24,14,.52);
  display:none;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(2px);
}
.scrim.open{display:flex}
.sheet{
  background:var(--surface);width:100%;max-width:620px;max-height:92dvh;
  border-radius:26px 26px 0 0;display:flex;flex-direction:column;overflow:hidden;
  animation:rise .24s cubic-bezier(.2,.8,.3,1);box-shadow:0 -20px 60px -30px rgba(36,24,14,.8);
}
@keyframes rise{from{transform:translateY(18px);opacity:.5}to{transform:none;opacity:1}}
.sheet-head{
  display:flex;align-items:flex-start;gap:12px;padding:20px 18px 14px;
  background:linear-gradient(180deg,var(--accent-soft),transparent);
  position:relative;
}
.sheet-head::after{content:"";position:absolute;left:18px;right:18px;bottom:0;height:1px;background:var(--line)}
.sheet-head h2{
  font-family:"Bricolage Grotesque",sans-serif;font-size:23px;font-weight:700;margin:0;letter-spacing:-.03em;
  text-wrap:balance;flex:1;line-height:1.15;
}
.sheet-close{width:34px;height:34px;flex:none;border-radius:50%;background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow)}
.sheet-close:hover{background:var(--surface-2)}
.sheet-close svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round}
.sheet-body{padding:18px;overflow-y:auto;flex:1}
.sheet-foot{padding:12px 18px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px;background:var(--surface)}
.sheet-foot .btn{flex:1;justify-content:center;padding:13px 14px;font-size:15px}

.servings{
  display:flex;align-items:center;gap:10px;margin-bottom:18px;font-size:13.5px;color:var(--muted);
  background:var(--surface-2);border-radius:999px;padding:6px 14px 6px 16px;width:fit-content;
}
.stepper{display:inline-flex;align-items:center;background:var(--surface);border-radius:999px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line-strong)}
.stepper button{width:34px;height:32px;display:grid;place-items:center;font-size:19px;color:var(--accent);line-height:1}
.stepper button:hover{background:var(--accent-soft)}
.stepper span{
  min-width:34px;text-align:center;font-family:"DM Mono",monospace;font-size:14px;color:var(--ink);
  padding:5px 0;font-variant-numeric:tabular-nums;
}
.subhead{
  font-family:"Bricolage Grotesque",sans-serif;font-size:15px;font-weight:700;text-transform:none;
  letter-spacing:-.015em;color:var(--accent);margin:24px 0 10px;display:flex;align-items:center;gap:10px;
}
.subhead:first-child{margin-top:0}
.subhead .rule{flex:1;height:2px;border-radius:2px;background:var(--accent-soft)}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:flex;gap:12px;padding:9px 12px;border-radius:11px;align-items:baseline}
.ing li:nth-child(odd){background:var(--surface-2)}
.ing .q{font-family:"DM Mono",monospace;font-size:13.5px;color:var(--citron);min-width:74px;flex:none;font-variant-numeric:tabular-nums;font-weight:500}
.ing .n{flex:1}
.steps{list-style:none;counter-reset:s;margin:0;padding:0}
.steps li{
  counter-increment:s;display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);line-height:1.6;
}
.steps li::before{
  content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;
  background:var(--accent);color:#FFFCF7;font-family:"DM Mono",monospace;font-size:12.5px;font-weight:500;
  display:grid;place-items:center;margin-top:1px;
}
:root[data-theme="dark"] .steps li::before,
:root:not([data-theme="light"]) .steps li::before{color:#10231A}
.steps li:last-child{border-bottom:none}

/* formulaires */
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;text-transform:none;letter-spacing:0;color:var(--muted);margin-bottom:6px;font-weight:700}
.field input,.field select,.field textarea{
  width:100%;background:var(--surface-2);border:1px solid transparent;border-radius:13px;
  padding:11px 13px;font-size:16px;outline:none;transition:.14s;
}
.field textarea{min-height:118px;resize:vertical;line-height:1.6}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.field .hint{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.row2{display:flex;gap:10px}
.row2 .field{flex:1}
.ingrow{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.ingrow input{background:var(--surface-2);border:1px solid transparent;border-radius:11px;padding:10px;font-size:15px;outline:none;transition:.14s}
.ingrow input:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.ingrow input.q{width:60px;flex:none;text-align:center}
.ingrow input.u{width:66px;flex:none}
.ingrow input.n{flex:1;min-width:0}
.ingrow select{flex:none;width:42px;padding:10px 4px;font-size:12px}
.ingrow .x{width:30px;flex:none;color:var(--muted);font-size:20px;line-height:1;text-align:center;border-radius:8px}
.ingrow .x:hover{color:var(--danger);background:var(--warm-soft)}
.picklist{list-style:none;margin:0;padding:0}
.picklist button{
  display:flex;width:100%;text-align:left;align-items:center;gap:11px;padding:13px 14px;
  font-size:16px;border-radius:13px;transition:.12s;
}
.picklist li + li{margin-top:2px}
.picklist .cat{font-size:12px;text-transform:none;letter-spacing:0;color:var(--citron);background:var(--citron-soft);border-radius:999px;padding:2px 10px;margin-left:auto;font-weight:700}
.picklist button:hover{color:var(--accent-ink);background:var(--accent-soft)}
/* La recette déjà posée sur ce repas se repère sans lire toute la liste. */
.picklist button[aria-current="true"]{color:var(--accent-ink);background:var(--accent-soft);font-weight:700}
.note{font-size:13px;color:var(--muted);line-height:1.6;margin:20px 6px 0;text-align:center}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:92px;z-index:60;
  background:var(--ink);color:var(--ground);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:500;
  box-shadow:var(--shadow-lift);opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
  max-width:calc(100% - 32px);text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}

/* ---------- pastilles de filtre (catégories) ---------- */
.filters{
  display:flex;gap:7px;overflow-x:auto;margin:0 -18px 14px;padding:2px 18px 8px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.filters::-webkit-scrollbar{display:none}
.filters:empty{display:none}
.chip{
  flex:none;border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:500;
  background:var(--surface);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-strong);
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:.12s;
}
.chip:hover{color:var(--ink)}
.chip .n{font-family:"DM Mono",ui-monospace,monospace;font-size:11.5px;opacity:.65}
.chip[aria-pressed="true"]{background:var(--accent);color:#FFFCF7;box-shadow:none;font-weight:700}
.chip[aria-pressed="true"] .n{opacity:.8}
:root[data-theme="dark"] .chip[aria-pressed="true"],
:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#10231A}
/* Les deux cadrages ne rangent pas par catégorie : ils ne gardent que les
   recettes cochées aux courses, ou celles posées sur un repas. Leurs teintes
   les séparent des catégories, qui les suivent derrière un filet — « Cochées »
   reprend le vert de « dans la liste », « Semaine » l'ambre de la semaine. */
.chip.list svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.chip.week[aria-pressed="true"]{background:var(--citron);color:#FFFCF7}
:root[data-theme="dark"] .chip.week[aria-pressed="true"],
:root:not([data-theme="light"]) .chip.week[aria-pressed="true"]{color:#16110D}
.chipsep{flex:none;width:1px;align-self:stretch;margin:3px 5px;background:var(--line-strong);border-radius:1px}

/* barre de recherche sans bouton d'envoi */
.addbar.plain form{padding:5px 8px 5px 16px}
.addbar .clr{
  width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;
  color:var(--muted);font-size:20px;line-height:1;
}
.addbar .clr:hover{background:var(--surface-2);color:var(--ink)}

/* ---------- groupes de recettes ---------- */
.grouphead{display:flex;align-items:center;margin:10px 2px 0}
.grouphead:first-child{margin-top:0}
.grouphead .fold{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:3px 0}
.grouphead .chev{
  width:15px;height:15px;flex:none;stroke:var(--muted);fill:none;stroke-width:2.6;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .15s;
}
.grouphead[data-closed="1"] .chev{transform:rotate(-90deg)}
.grouphead[data-closed="1"] .n{color:var(--accent);background:var(--accent-soft)}
.grouphead h3{
  font-family:"Bricolage Grotesque",sans-serif;font-size:15px;font-weight:700;margin:0;
  letter-spacing:-.015em;color:var(--ink);
}
.grouphead .rule{flex:1;height:2px;border-radius:2px;background:var(--line)}
.grouphead .n{
  font-family:"DM Mono",ui-monospace,monospace;font-size:11.5px;color:var(--muted);
  background:var(--surface-2);border-radius:999px;padding:2px 9px;
}

/* ---------- clavier virtuel ----------
   Le clavier recouvre le bas de l'écran sans faire remonter la page : le
   champ qu'on remplit se retrouve dessous. La barre d'onglets ne sert à
   rien pendant la frappe, on l'efface ; et on rend à la page la hauteur
   que le clavier lui prend (--kb), sans quoi un champ situé en bas n'a
   plus assez de vide sous lui pour remonter. */
:root.kb .tabbar{display:none}
:root.kb .view{padding-bottom:calc(var(--kb, 0px) + 28px)}
:root.kb .scrim{bottom:var(--kb, 0px)}
:root.kb .sheet{max-height:calc(100dvh - var(--kb, 0px) - 12px)}
.item,.ingrow,.addbar,.field{scroll-margin-top:110px;scroll-margin-bottom:130px}

/* ---------- pied de la liste de courses ---------- */
.listfoot{display:flex;justify-content:center;margin:4px 0 0}

/* ---------- export en image ---------- */
a.btn{text-decoration:none}
.exportwrap{position:relative;border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
/* L'aperçu montre le haut de l'affiche à sa taille, pas l'affiche entière
   réduite en timbre-poste ; le fondu dit qu'elle continue. */
.exportwrap::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:64px;pointer-events:none;
  background:linear-gradient(180deg,transparent,var(--surface));
}
.exportprev{
  display:block;width:100%;max-height:46dvh;object-fit:cover;object-position:top;
  background:var(--surface-2);
}
.exportinfo{
  margin:12px 6px 0;text-align:center;font-family:"DM Mono",monospace;
  font-size:11.5px;color:var(--muted);line-height:1.6;
}

/* ---------- gestion des rayons ---------- */
.rayons{list-style:none;margin:0;padding:0}
.rayonrow{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:13px}
.rayonrow:nth-child(odd){background:var(--surface-2)}
.rayonrow .pic{
  width:34px;height:34px;flex:none;border-radius:12px;background:var(--ray-soft);
  display:grid;place-items:center;font-size:17px;line-height:1;
}
.rayonrow .nm{
  flex:1;min-width:0;font-size:15.5px;font-weight:700;color:var(--ray);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;
}
.rayonrow .nm small{display:block;font-size:11.5px;font-weight:400;color:var(--muted)}
.rayonrow .mv{width:36px;height:36px;flex:none;border-radius:11px;display:grid;place-items:center;color:var(--muted)}
.rayonrow .mv:hover{background:var(--surface);color:var(--accent)}
.rayonrow .mv[disabled]{opacity:.22;pointer-events:none}
.rayonrow .mv svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.swatches{display:flex;flex-wrap:wrap;gap:9px}
.swatch{
  width:36px;height:36px;border-radius:12px;background:var(--ray);
  box-shadow:inset 0 0 0 2px var(--surface);transition:.12s;
}
.swatch:hover{transform:scale(1.06)}
.swatch[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--surface), 0 0 0 2.5px var(--ray)}
.picrow{display:flex;gap:9px;align-items:flex-start}
.picrow .field{margin-bottom:0}
.picrow .field.pic{width:76px;flex:none}
.picrow .field.pic input{text-align:center;font-size:20px}
.picrow .field.nm{flex:1;min-width:0}
</style>

<div class="app">
  <header class="topbar">
    <div class="brandrow">
      <h1 class="brand">Panier <span>Commun</span></h1>
      <button class="sync" id="sync" data-state="local" data-act="sync" title="Synchronisation"><span class="dot"></span><span id="syncLabel">Ce téléphone</span></button>
    </div>
    <div class="viewhead">
      <h2 id="viewTitle">Recettes</h2>
      <span class="count" id="viewCount"></span>
      <div class="headactions" id="headActions"></div>
    </div>
  </header>

  <section class="view active" id="view-recipes">
    <div class="addbar plain">
      <form id="findForm" autocomplete="off">
        <svg class="mag" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="findInput" placeholder="Chercher une recette, un ingrédient…" aria-label="Chercher une recette">
        <button class="clr" type="button" data-act="find-clear" id="findClear" aria-label="Effacer la recherche" hidden>×</button>
      </form>
    </div>
    <div class="filters" id="catFilters"></div>
    <ul class="recipes" id="recipeList"></ul>
  </section>

  <section class="view" id="view-list">
    <div class="addbar">
      <form id="addForm" autocomplete="off">
        <svg class="mag" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="addInput" placeholder="2 kg pommes de terre…" aria-label="Ajouter un article">
        <button class="go" type="submit" aria-label="Ajouter"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      </form>
      <div class="parsed" id="parsed" hidden></div>
      <div class="suggest" id="suggest" hidden></div>
    </div>
    <div id="shopList"></div>
  </section>

  <section class="view" id="view-week">
    <div class="days" id="weekList"></div>
    <p class="note">Un menu posé ici reste visible sur les deux téléphones. « Tout aux courses » coche chaque recette du planning et verse ses ingrédients dans la liste.</p>

  ["boissons",    "Boissons",                    "🥤", "indigo"],

];
const RAYONS_DEFAUT_CLES = new Set(RAYONS_DEFAUT.map(r => r[0]));

/* Les dix teintes proposées à la création d'un rayon. Chacune a sa
   déclinaison claire et sombre dans la feuille de style. */
const NUANCES = [
  ["leaf","Vert"], ["rose","Rose"], ["amber","Ambre"], ["crust","Pain"], ["olive","Olive"],
  ["berry","Prune"], ["ice","Glacier"], ["indigo","Indigo"], ["teal","Sarcelle"], ["stone","Pierre"]

/* Un pictogramme par catégorie de recette, pour que la tuile se repère
   d'un coup d'œil sans lire l'étiquette. Les catégories étant libres,
   celles que vous inventez retombent sur le couvert. */
const CAT_PIC = {
  "Healthy":"🥬", "Plaisir":"🧀",
  "Plat":"🍲", "Entrée":"🥗", "Dessert":"🍰",
  "Petit-déj":"🥐", "Apéro":"🍷", "Accompagnement":"🥘",
  "Soupe":"🥣", "Salade":"🥗", "Goûter":"🍪", "Boisson":"🍹"
};
const CAT_PIC_DEFAUT = "🍴";

function catPic(cat){ return CAT_PIC[cat] || CAT_PIC_DEFAUT; }

/* ---------------------------------------------------------------
   Rayons : les dix rayons ci-dessus sont les valeurs par défaut. La
   collection « rayons » ne stocke que les écarts — un document dont
   l'identifiant est celui d'un rayon par défaut le retouche (nom,
   pictogramme, teinte, rang), un document au nouvel identifiant est
   un rayon que vous avez ajouté.
--------------------------------------------------------------- */
function rayonList(){
  const out = [];
  RAYONS_DEFAUT.forEach(([key, name, pic, swatch], i)=>{
    const o = state.rayons.get(key) || {};
    out.push({
      key, custom:false,
      name:   o.name || name,
      pic:    o.pic != null ? o.pic : pic,
      swatch: o.swatch || swatch,
      order:  o.order != null ? o.order : i * 100,
      touched: !!(o.name || o.pic != null || o.swatch || o.order != null)
    });
  });
  for(const [key, o] of state.rayons){
    if(RAYONS_DEFAUT_CLES.has(key)) continue;
    out.push({
      key, custom:true,
      name:   o.name || key,
      pic:    o.pic || "",
      swatch: o.swatch || "stone",
      order:  o.order != null ? o.order : 9000,
      touched: true
    });
  }
  out.sort((a,b)=> a.order - b.order || a.name.localeCompare(b.name, "fr"));
  return out;
}
function rayonMap(){ return new Map(rayonList().map(d => [d.key, d])); }
function rayonDef(key){ return rayonMap().get(key) || null; }
function rayonName(key){ const d = rayonDef(key); return d ? d.name : "Divers"; }

/* Réécrit le rang de chaque rayon d'après sa position dans la liste
   donnée : un seul document par rayon déplacé. */
async function saveRayonOrder(defs){
  for(let i = 0; i < defs.length; i++){
    const d = defs[i];
    const cur = state.rayons.get(d.key);
    if(cur && cur.order === i * 100) continue;
    if(!cur && d.order === i * 100) continue;
    await save("rayons", d.key, Object.assign({}, cur || {}, {order:i * 100}));
  }
}
async function moveRayon(key, dir){
  const defs = rayonList();
  const i = defs.findIndex(d => d.key === key);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= defs.length) return;
  defs.splice(j, 0, defs.splice(i, 1)[0]);
  await saveRayonOrder(defs);
}
async function saveRayon(key, name, pic, swatch){
  name = (name || "").trim();
  if(!name) return null;
  if(!key){
    const base = slug(name);
    const taken = new Set([...RAYONS_DEFAUT_CLES, ...state.rayons.keys()]);
    key = base;
    while(taken.has(key)) key = base + "-" + Math.random().toString(36).slice(2, 5);
    const defs = rayonList();
    const at = defs.findIndex(d => d.key === "divers");
    const pos = at >= 0 ? at : defs.length;
    await save("rayons", key, {name, pic, swatch, custom:true, order:pos * 100, createdAt:Date.now()});
    const next = rayonList().filter(d => d.key !== key);
    next.splice(pos, 0, {key, name, pic, swatch, custom:true, order:pos * 100});
    await saveRayonOrder(next);
    return key;
  }
  const cur = state.rayons.get(key) || {};
  await save("rayons", key, Object.assign({}, cur, {name, pic, swatch}));
  return key;
}
/* L'ordre des rayons a été réécrit pour suivre le parcours en magasin.
   Un rang enregistré du temps de l'ordre précédent l'emporterait sur le
   nouveau : on l'efface une fois par téléphone, en gardant le nom, le
   pictogramme et la teinte qu'on avait retouchés. Les rayons ajoutés à
   la main gardent leur rang, et un rang posé après coup depuis « Gérer
   les rayons » n'est plus jamais touché. */
async function alignerParcours(){
  if(ui.parcours) return;
  ui.parcours = true;
  saveUI(true);
  for(const [key, o] of [...state.rayons]){
    if(!RAYONS_DEFAUT_CLES.has(key) || o.order == null) continue;
    const body = Object.assign({}, o);
    delete body.order;
    await save("rayons", key, body);
  }
  await rangerSurLeNouveauParcours();
}
/* Le découpage des rayons a changé sous les articles déjà écrits : le riz
   et les pâtes ne sont plus rangés avec les condiments, les œufs ne sont
   plus avec les fromages. On repasse donc une fois sur les lignes de
   courses et sur les ingrédients du carnet. Trois garde-fous : le rayon
   corrigé à la main, que le garde-manger retient, l'emporte toujours ; un
   article posé dans un rayon que vous avez ajouté vous-même n'est jamais
   délogé ; un nom que l'app ne sait pas deviner reste où il est plutôt
   que de tomber dans Divers. */
function relecteurDeRayon(){
  const corrige = new Map();
  for(const p of state.pantry.values()){
    if(p.name && p.rayon) corrige.set(norm(p.name), p.rayon);
  }
  const ajoutes = new Set([...state.rayons.keys()].filter(k => !RAYONS_DEFAUT_CLES.has(k)));
  return (nom, actuel)=>{
    if(!nom || ajoutes.has(actuel)) return actuel;
    const fixe = corrige.get(norm(nom));
    if(fixe) return fixe;
    const vu = guessRayon(nom);
    return vu === "divers" ? actuel : vu;
  };
}
async function rangerSurLeNouveauParcours(){
  const revoir = relecteurDeRayon();
  for(const [id, it] of [...state.shopping]){
    const r = revoir(it.name, it.rayon);
    if(r && r !== it.rayon) await save("shopping", id, Object.assign({}, it, {rayon:r}));
  }
  for(const [id, rec] of [...state.recipes]){
    let bouge = false;
    const ings = (rec.ingredients || []).map(ing => {
      const r = revoir(ing.name, ing.rayon);
      if(!r || r === ing.rayon) return ing;
      bouge = true;
      return Object.assign({}, ing, {rayon:r});
    });
    if(bouge) await save("recipes", id, Object.assign({}, rec, {ingredients:ings}));
  }
}
/* Supprimer un rayon ajouté : ce qu'il contenait retombe dans Divers,
   pour qu'aucun article ni ingrédient ne disparaisse de la liste. */
async function delRayon(key){
  if(RAYONS_DEFAUT_CLES.has(key)) return;
  for(const [id, it] of [...state.shopping]){
    if(it.rayon === key) await save("shopping", id, Object.assign({}, it, {rayon:"divers"}));
  }
  for(const [id, r] of [...state.recipes]){
    if(!(r.ingredients || []).some(i => i.rayon === key)) continue;
    await save("recipes", id, Object.assign({}, r, {
      ingredients: r.ingredients.map(i => i.rayon === key ? Object.assign({}, i, {rayon:"divers"}) : i)
    }));
  }
  await drop("rayons", key);
}
